function yedekIslemleriniBagla() {
  const durum = $('#yedek-durum'), sec = $('#yedek-sec'), indir = $('#yedek-indir');
  const dosya = $('#yedek-dosya'), onizleme = $('#yedek-onizleme'), yukle = $('#yedek-yukle');
  let yedek;
  const mesgul = durum => { sec.disabled = indir.disabled = yukle.disabled = durum; };
  const gonderimleriBekle = async () => {
    await kaydet();
    if (bekleyen.size || iptaller.size) throw new Error('Bekleyen kayıtlar veya geri almalar var. Sunucuyu kontrol edip yeniden dene.');
  };
  sec.onclick = () => dosya.click();
  indir.onclick = async () => {
    mesgul(true);
    durum.textContent = 'Yedek hazırlanıyor…';
    try {
      await gonderimleriBekle();
      if (!await ayarYazimi) throw new Error('Son ayarlar kaydedilemedi. Ayarları tekrar kaydedip yeniden dene.');
      const veri = await api('/api/yedek');
      const url = URL.createObjectURL(new Blob([JSON.stringify(veri, null, 2)], { type: 'application/json' }));
      const link = document.createElement('a');
      link.href = url;
      link.download = 'almanca-yedek-' + new Date().toISOString().slice(0, 10) + '.json';
      link.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      durum.textContent = `Yedek hazır: ${veri.tekrarlar.length} tekrar ve ayarlar.`;
    } catch (e) {
      durum.textContent = `Yedek alınamadı. ${e.message}`;
    } finally { mesgul(false); }
  };
  dosya.onchange = async () => {
    const secilen = dosya.files[0];
    dosya.value = '';
    if (!secilen) return;
    yedek = undefined;
    onizleme.hidden = true;
    mesgul(true);
    durum.textContent = 'Yedek kontrol ediliyor…';
    try {
      let veri;
      try { veri = JSON.parse((await secilen.text()).replace(/^\uFEFF/, '')); }
      catch { throw new Error('Almanca FSRS yedek dosyasını seç.'); }
      await gonderimleriBekle();
      const { toplam, yeni } = await api('/api/yedek', { yedek: veri, onizleme: true });
      $('#yedek-ozet', onizleme).textContent = `Yedekte ${toplam} tekrar var. ${yeni} yeni kayıt eklenecek. Mevcut kayıtların korunur.`;
      $('#yedek-ayarlar', onizleme).checked = false;
      yedek = veri;
      onizleme.hidden = false;
      durum.textContent = '';
    } catch (e) {
      durum.textContent = `Yedek açılamadı. ${e.message}`;
    } finally { mesgul(false); }
  };
  yukle.onclick = async () => {
    if (!yedek) return;
    const ayarlariAl = $('#yedek-ayarlar', onizleme).checked;
    mesgul(true);
    durum.textContent = 'Kayıtlar birleştiriliyor…';
    try {
      await gonderimleriBekle();
      await ayarYazimi;
      const sonuc = await api('/api/yedek', { yedek, ayarlariAl });
      yedek = undefined;
      onizleme.hidden = true;
      const mesaj = `${sonuc.yeni} yeni tekrar eklendi.${ayarlariAl ? ' Yedekteki ayarlar uygulandı.' : ''}`;
      try {
        const [kayitlar, ayarlar] = await Promise.all([api('/api/tekrarlar'), api('/api/ayarlar')]);
        if (ayarlariAl) D.ayar = { ...VARSAYILAN_AYAR, ...ayarlar };
        kayitlariYukle(kayitlar);
        if ($('#yedek-durum') === durum) {
          ayarEkran();
          $('#yedek-durum').textContent = mesaj;
        } else if (D.ekran === 'ana') anaEkran();
      } catch {
        durum.textContent = mesaj + ' Güncel durumu görmek için sayfayı yenile.';
        if (!durum.isConnected) toast(durum.textContent);
      }
    } catch (e) {
      durum.textContent = `Yedek birleştirilemedi. ${e.message}`;
    } finally { mesgul(false); }
  };
}

// ------------------------------------------------------------ çalışma oturumu
const TUR_GORULDU_ANAHTAR = 'almanca-tur-goruldu';
function turGorulduOku(kartId) {
  try {
    const tum = JSON.parse(localStorage.getItem(TUR_GORULDU_ANAHTAR) || '{}');
    return new Set(tum && Array.isArray(tum[kartId]) ? tum[kartId] : []);
  } catch { return new Set(); }
}
function turGorulduEkle(kartId, ogeIdler) {
  if (!kartId || !ogeIdler?.length) return;
  try {
    const tum = JSON.parse(localStorage.getItem(TUR_GORULDU_ANAHTAR) || '{}') || {};
    const mevcut = new Set(Array.isArray(tum[kartId]) ? tum[kartId] : []);
    for (const id of ogeIdler) if (id) mevcut.add(id);
    tum[kartId] = [...mevcut];
    localStorage.setItem(TUR_GORULDU_ANAHTAR, JSON.stringify(tum));
  } catch {}
}
function tamCumleMi(oge) {
  const ilk = (oge?.cevaplar?.[0] ?? oge?.cevap ?? '').trim();
  return oge?.tip === 'cift' && /[.!?]$/.test(ilk) && ilk.split(/\s+/).length >= 3;
}

function oturumBaslat(sureli = false) {
  const vade = vadesiGelenler();
  const yeni = yeniler(yeniKalan());
  const kuyruk = [];
  let y = 0;
  for (let i = 0; i < vade.length; i++) { kuyruk.push(vade[i]); if ((i + 1) % 4 === 0 && y < yeni.length) kuyruk.push(yeni[y++]); }
  while (y < yeni.length) kuyruk.push(yeni[y++]);
  if (!kuyruk.length) return anaEkran();
  sonBitenOturum = null;
  const basla = Date.now();
  D.oturum = { kuyruk, toplam: kuyruk.length, yapilan: 0, basla, bitis: sureli ? basla + 10 * DK : null,
    ilkCevaplar: new Map(), sonOge: {}, aktif: null, tanitildi: new Set(), secilen: null };
  ekranGoster('calis');
}

function kelimeElemeBaslat(uniteId) {
  const unite = D.uniteler.find(u => u.id === uniteId);
  const kuyruk = (unite?.kartlar || []).filter(k => k.tur === 'kelime' && !D.durum.has(k.id));
  if (!kuyruk.length) return;
  sonBitenOturum = null;
  D.oturum = { kuyruk, toplam: kuyruk.length, yapilan: 0, basla: Date.now(),
    ilkCevaplar: new Map(), sonOge: {}, aktif: null, tanitildi: new Set(), secilen: null,
    eleme: { bilinen: 0, kalan: 0 } };
  ekranGoster('calis');
}

function elemeIlerle() {
  const o = D.oturum;
  if (!o?.eleme || !o.aktif?.cevaplandi) return;
  o.yapilan++;
  o.kuyruk.shift();
  o.secilen = null;
  kartGoster();
}

function ogeSec(kart) {
  if (kart.ogeler.length <= 1 || !D.durum.has(kart.id)) return kart.ogeler[0];
  const st = D.durum.get(kart.id), son = st?.ogeSon || {}, puan = st?.ogePuan || {};
  const onceki = D.oturum?.sonOge?.[kart.id];
  // Havuz ≥ 3 ise oturumda ve son tekrarda sorulan aday dışı; küçük havuzda yalnız oturum dışlaması.
  const aday = kart.ogeler.filter(o => o.id !== onceki && (kart.ogeler.length < 3 || o.id !== st?.sonOgeId));
  const gorulen = turGorulduOku(kart.id);
  const zayif = o => (puan[o.id] <= 2 ? 0 : 1);
  const turSira = o => (gorulen.has(o.id) ? 1 : 0);
  const uretimSira = o => (tamCumleMi(o) ? 0 : 1);
  const karma = o => fnv(`${kart.id}:${o.id}:${st?.tekrar || 0}`);
  return aday.slice().sort((a, b) =>
    zayif(a) - zayif(b)
    || (son[a.id] ?? -1) - (son[b.id] ?? -1)
    || turSira(a) - turSira(b)
    || uretimSira(a) - uretimSira(b)
    || (karma(a) < karma(b) ? -1 : karma(a) > karma(b) ? 1 : 0)
  )[0] || kart.ogeler[0];
}

function pratikBaslat(kuyruk, baslik, donus) {
  if (!kuyruk.length) return;
  sonBitenOturum = null;
  D.oturum = { kuyruk, toplam: kuyruk.length, yapilan: 0, dogru: 0, basla: Date.now(), pratik: { baslik, donus, hatalar: new Map() } };
  ekranGoster('calis');
}

function oturumdanCik() {
  if (D.oturum?.benzer?.tur) return kuralTuruBitir();
  if (D.oturum?.benzer) return benzerdenDon();
  const donus = D.oturum?.pratik?.donus || 'ana';
  D.oturum = null;
  ekranGoster(donus);
}

function soruHtml(oge) {
  if (oge.tip === 'bosluk') {
    const metin = oge.parcalar.map((p, i) => i % 2 ? `<span class="bos">___</span>` : esc(p)).join('');
    return metin + (oge.ipucu ? ` <span class="ipucu">(${esc(oge.ipucu)})</span>` : '');
  }
  const { govde, ipucu } = ipucuAyir(oge.soru);
  return esc(govde) + (ipucu ? ` <span class="ipucu">(${esc(ipucu)})</span>` : '');
}
const TUR_AD = { kelime: 'Kelime', kalip: 'Kalıp', kural: 'Kural', tanima: 'Tanıma', dikte: 'Dikte' };

function artikelKartGoster() {
  const o = D.oturum;
  if (!o || !o.kuyruk.length) return oturumBitti();
  const s = o.kuyruk[0];
  o.aktif = { kart: s.kart, oge: s.oge, soru: s, basla: Date.now(), cevaplandi: false };
  const oran = Math.min(100, 100 * o.yapilan / o.toplam);
  $('#app').innerHTML = `
  <div class="topline">
    <button class="btn small" id="cik" title="Esc">Çık</button>
    <div class="prog" role="progressbar" aria-label="Oturum" aria-valuenow="${Math.round(oran)}" aria-valuemin="0" aria-valuemax="100"><i style="width:${oran}%;background:var(--acc)"></i></div>
    <span class="small muted">${o.yapilan + 1} / ${o.toplam}</span>
  </div>
  <div class="panel kart">
    <div class="meta">
      <span class="chip">Artikel pratiği</span>
      <span class="chip" title="${esc(s.kart.unite.baslik)}">${esc(uniteEtiketi(s.kart.unite))}</span>
    </div>
    <div class="soru" lang="de"><span class="bos">___</span> ${esc(s.isim)}</div>
    <p class="small muted" style="margin-top:0">${esc(s.anlam)}${s.oge.not ? ` · ${esc(s.oge.not)}` : ''}</p>
    <div class="artikel-secim" id="alt">
      <button type="button" data-art="der"><span class="art art-der">der</span> <kbd>1</kbd></button>
      <button type="button" data-art="die"><span class="art art-die">die</span> <kbd>2</kbd></button>
      <button type="button" data-art="das"><span class="art art-das">das</span> <kbd>3</kbd></button>
    </div>
  </div>`;
  $('#cik').onclick = oturumdanCik;
  document.querySelectorAll('[data-art]').forEach(btn => {
    btn.onclick = () => artikelCevapla(btn.dataset.art);
  });
}

function artikelCevapla(secim) {
  const o = D.oturum, a = o?.aktif;
  if (!o?.artikelModu || !a || a.cevaplandi) return;
  a.cevaplandi = true;
  const s = a.soru;
  const dogru = secim === s.artikel;
  a.sonuc = { kod: dogru ? 'dogru' : 'yanlis', hedef: s.tam, tam: s.tam };
  $('#alt').outerHTML = `
    <div class="sonuc ${dogru ? 'ok' : 'bad'}" aria-live="polite">
      <div class="baslik">${dogru ? 'Doğru' : `Yanlış — <span class="yazdin" lang="de">${esc(secim)}</span> seçtin`}</div>
      <div class="cevap"><span lang="de">${artikelRenklendir(s.tam)}</span> <button class="ses simge" id="ses" aria-label="Dinle" title="Dinle">${SES_SVG}</button></div>
      ${s.oge.not ? `<div class="not">${esc(s.oge.not)}</div>` : ''}
    </div>
    <button class="btn primary" id="sonraki">${o.kuyruk.length === 1 ? 'Sonucu gör' : 'Sonraki soru'} <kbd>Enter</kbd></button>`;
  $('#ses').onclick = () => seslendir(s.tam);
  if (D.ayar.sesOto) seslendir(s.tam);
  $('#sonraki').onclick = pratikIlerle;
  $('#sonraki').focus({ preventScroll: true });
}

function kartGoster(geri = null) {
  const o = D.oturum;
  if (!o || (!o.benzer && (!o.kuyruk.length || (!geri && !o.uzat && o.bitis && o.yapilan && Date.now() >= o.bitis)))) return oturumBitti();
  if (o.artikelModu) return artikelKartGoster();
  const secili = o.benzer?.soru || (o.pratik ? o.kuyruk[0] : null);
  const kart = geri?.kart || secili?.kart || o.kuyruk[0];
  if (!geri && !secili && o.secilen?.kart !== kart) o.secilen = { kart, oge: ogeSec(kart) };
  const oge = geri?.oge || secili?.oge || o.secilen.oge;
  const yeni = !secili && !D.durum.has(kart.id);
  if (!geri && yeni && kart.tur === 'kural' && !(o.tanitildi ||= new Set()).has(kart.id)) return kuralTanit(kart, oge);
  if (!geri && yeni && !o.eleme && D.ayar.onceGoster !== false && (kart.tur === 'kelime' || kart.tur === 'kalip') && !(o.tanitildi ||= new Set()).has(kart.id)) return kelimeTanit(kart, oge);
  o.aktif = geri || { kart, oge, basla: Date.now(), cevaplandi: false };
  const tanima = kart.tur === 'tanima', dikte = kart.tur === 'dikte' && sesVar();
  const sesler = dikte ? (window.speechSynthesis?.getVoices?.() || []) : [];
  const almancaSesYok = dikte && sesler.length > 0 && !almancaSes;
  const yonYazi = tanima ? 'Anlamını aklından söyle, sonra göster' : dikte ? 'Dinle ve duyduğun Almanca cümleyi yaz' : kart.tur === 'kural' ? '' : 'Almancasını yaz';
  const yon = yonYazi ? `<span class="small muted">${yonYazi}</span>` : '';
  const talimat = kart.tur === 'kural' ? kart.talimat.join(' ') : '';
  const boslukNotu = oge.tip === 'bosluk' ? '<p class="talimat">Boşluğu (birden çoksa sırayla) ya da cümlenin tamamını yaz.</p>' : '';
  const soruIcerik = dikte
    ? `<div class="dinle-satir"><button class="btn primary" id="dinle" type="button" aria-label="Dinle" title="Dinle">${SES_SVG} Dinle</button><button class="btn" id="yavas" type="button" title="Yavaş dinle (Alt+Y)">Yavaş dinle <kbd>Alt+Y</kbd></button></div>${almancaSesYok ? '<p class="small yuk-uyari" style="margin-top:8px">Tarayıcıda Almanca ses bulunamadı. Ayarlar’dan Dikte kartlarını kapatabilir ya da Almanca ses paketi yükleyebilirsin.</p>' : ''}`
    : tanima ? `<span lang="de">${artikelRenklendir(oge.soru)}</span> <button class="ses simge" id="ses-soru" aria-label="Dinle" title="Dinle">${SES_SVG}</button>`
    : soruHtml(oge);
  const girisHtml = tanima ? '' : `
    <input class="giris" id="giris" aria-label="Cevabın" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" lang="de" maxlength="1000" placeholder="Cevabın…">
    <div class="umlaut">${['ä', 'ö', 'ü', 'ß', 'Ä', 'Ö', 'Ü'].map(c => `<button tabindex="-1" data-c="${c}">${c}</button>`).join('')}</div>`;
  const biliyorumBtn = !o.pratik && !o.benzer && !o.eleme ? '<button class="btn" id="biliyorum" type="button" title="Bu kartı olgun olarak kaydet (Alt+B)">Zaten biliyorum</button>' : '';
  const altHtml = tanima
    ? `<div id="alt" class="row"><button class="btn primary" id="goster">Anlamını göster <kbd>Enter</kbd></button>${biliyorumBtn}</div>`
    : `<div id="alt" class="row">
      <button class="btn primary" id="kontrol">Kontrol et <kbd>Enter</kbd></button>
      <button class="btn" id="bilmiyorum">Bilmiyorum</button>
      ${biliyorumBtn}
    </div>`;
  const toplam = Math.max(o.toplam, o.yapilan + o.kuyruk.length);
  const oran = Math.min(100, 100 * o.yapilan / toplam);
  $('#app').innerHTML = `
  <div class="topline">
    <button class="btn small" id="cik" title="Esc">${o.benzer && !o.benzer.tur ? 'Karta dön' : 'Çık'}</button>
    ${o.benzer?.tur ? '<button class="btn small" id="tur-gec" type="button">Turu geç</button>' : ''}
    ${o.geriAl && (!o.benzer || o.benzer.tur) && !o.pratik ? '<button class="btn small" id="geri-al" type="button" title="Son kartı geri al (Ctrl+Z)">' + IKON.geriAl + ' Geri al</button>' : ''}
    <div class="prog" role="progressbar" aria-label="Oturum" aria-valuenow="${Math.round(oran)}" aria-valuemin="0" aria-valuemax="100"><i style="width:${oran}%;background:var(--acc)"></i></div>
    <span class="small muted">${o.benzer?.tur ? `Pekiştirme ${o.benzer.sira + 1} / ${o.benzer.sorular.length}` : o.benzer ? 'Ek pratik' : o.bitis
      ? `10 dk oturum · ${o.yapilan + 1}. kart`
      : `${o.yapilan + 1} / ${toplam}`}</span>
  </div>
  <div class="panel kart">
    <div class="meta">
      ${yeni ? '<span class="chip new">yeni</span>' : ''}
      ${o.benzer ? '<span class="chip">Benzer soru</span>' : ''}
      ${o.pratik ? '<span class="chip">Kısa pratik</span>' : ''}
      ${o.eleme ? '<span class="chip">Kelime eleme</span>' : ''}
      <span class="chip">${TUR_AD[kart.tur]}${kart.tur === 'kural' ? ': ' + esc(kart.baslik) : ''}</span>
      <span class="chip" title="${esc(kart.unite.baslik)}">${esc(uniteEtiketi(kart.unite))}</span>
      <span style="margin-left:auto"></span>
      ${(kart.unite.konu || kart.unite.yazmaGorevleri?.length) ? '<button class="btn small" id="konu">' + IKON.kitap + ' Konu</button>' : ''}
    </div>
    ${talimat ? `<p class="talimat">${esc(talimat)}</p>` : ''}
    <div class="soru"${oge.tip === 'bosluk' ? ' lang="de"' : ''}>${soruIcerik}</div>
    ${yon}${boslukNotu}
    ${girisHtml}
    ${altHtml}
  </div>`;
  const giris = $('#giris');
  if (geri) {
    if (giris) giris.value = geri.girdi;
    sonucuGoster(o, geri, false);
    return void ($('#cik').onclick = oturumdanCik);
  }
  $('#cik').onclick = oturumdanCik;
  $('#tur-gec')?.addEventListener('click', kuralTuruBitir);
  $('#geri-al')?.addEventListener('click', sonKaydiGeriAl);
  $('#konu')?.addEventListener('click', () => konuAc(kart.unite));
  $('#biliyorum')?.addEventListener('click', () => zatenBiliyorum(kart, oge));
  if (tanima) {
    $('#goster').onclick = () => cevapla(null);
    $('#goster').focus({ preventScroll: true });
    $('#ses-soru').onclick = () => seslendir(oge.soru);
    if (D.ayar.sesOto) seslendir(oge.soru);
    return;
  }
  if (dikte) {
    $('#dinle').onclick = () => { seslendir(dikteMetni(oge)); giris.focus(); };
    $('#yavas').onclick = () => { seslendir(dikteMetni(oge), 0.7); giris.focus(); };
    setTimeout(() => { if (o.aktif?.oge === oge && !o.aktif.cevaplandi) seslendir(dikteMetni(oge)); }, 250);
  }
  giris.focus({ preventScroll: true });
  document.querySelectorAll('.umlaut button').forEach(b => {
    b.addEventListener('mousedown', e => e.preventDefault());
    b.addEventListener('click', () => {
      if (giris.readOnly) return;
      const s = giris.selectionStart ?? giris.value.length, e = giris.selectionEnd ?? s;
      giris.value = giris.value.slice(0, s) + b.dataset.c + giris.value.slice(e);
      giris.setSelectionRange(s + 1, s + 1); giris.focus();
    });
  });
  $('#kontrol').onclick = () => cevapla(giris.value);
  $('#bilmiyorum').onclick = () => cevapla('');
  giris.addEventListener('keydown', e => {
    if (dikte && e.altKey && !e.ctrlKey && !e.metaKey && !e.repeat) {
      const tus = (e.key || '').toLowerCase();
      if (tus === 'r') { e.preventDefault(); e.stopPropagation(); seslendir(dikteMetni(oge)); return; }
      if (tus === 'y') { e.preventDefault(); e.stopPropagation(); seslendir(dikteMetni(oge), 0.7); return; }
    }
    if (e.key === 'Enter' && !e.repeat && !e.isComposing && !giris.readOnly) { e.preventDefault(); e.stopPropagation(); cevapla(giris.value); }
  });
}

function cevapla(girdi) {
  const o = D.oturum, a = o?.aktif; if (!a || a.cevaplandi) return;
  a.cevaplandi = true; a.ms = Date.now() - a.basla;
  a.girdi = girdi ?? '';
  a.sonuc = a.oge.tip === 'tanima' ? { kod: 'oz', hedef: a.oge.cevap, tam: a.oge.cevap } : denetle(a.oge, girdi);
  a.oneri = ONERI[a.sonuc.kod];
  if (o.benzer && a.kart?.tur === 'kural' && a.oge?.id) turGorulduEkle(a.kart.id, [a.oge.id]);
  if (o.eleme) {
    if (a.sonuc.kod === 'dogru') {
      o.geriAl = { eklenenIdler: [], kuyruk: [...o.kuyruk], yapilan: o.yapilan,
        ilkCevaplar: new Map(o.ilkCevaplar), sonOge: { ...o.sonOge }, eleme: { ...o.eleme } };
      const kayit = biliniyorKaydet(a.kart, a.oge, a.ms);
      o.geriAl.eklenenIdler.push(kayit.id);
      o.eleme.bilinen++;
    } else o.eleme.kalan++;
  }
  sonucuGoster(o, a);
}

// Yeni bir kural konusu ilk kez geldiğinde: talimat, hatırlatma ve 3 çözülmüş örnek; sonra asıl soru.
function kuralTanit(kart, oge) {
  const o = D.oturum;
  o.aktif = null;
  const ornekler = kart.ogeler.filter(x => x !== oge).slice(0, 3);
  const ornekIdler = ornekler.map(x => x.id);
  (o.tanitimOrnekleri ||= new Map()).set(kart.id, ornekIdler);
  turGorulduEkle(kart.id, ornekIdler);
  $('#app').innerHTML = `
  <div class="topline"><button class="btn small" id="cik" title="Esc">Çık</button><span class="small muted">Yeni konu tanıtımı</span></div>
  <div class="panel kart">
    <div class="meta">
      <span class="chip new">yeni konu</span>
      <span class="chip" title="${esc(kart.unite.baslik)}">${esc(uniteEtiketi(kart.unite))}</span>
      <span style="margin-left:auto"></span>
      ${(kart.unite.konu || kart.unite.yazmaGorevleri?.length) ? '<button class="btn small" id="konu">' + IKON.kitap + ' Konu anlatımı</button>' : ''}
    </div>
    <div class="tanitim-baslik">${esc(kart.baslik)}</div>
    ${kart.talimat.length ? `<p class="talimat">${esc(kart.talimat.join(' '))}</p>` : ''}
    ${kart.hatirlatma.length ? `<div class="hatirlatma small">${kart.hatirlatma.map(satirIci).join('<br>')}</div>` : ''}
    ${ornekler.length ? `<p class="small muted">Önce çözülmüş ${ornekler.length} örneğe bak. Sonra bir soruyu kendin çöz; o cevabın puanı tekrar takvimine yazılır.</p>
    <ol class="ornekler">${ornekler.map(x => `<li><div>${soruHtml(x)}</div>
      <div class="ornek-cevap">→ <b lang="de">${esc(x.cevap)}</b> <button class="ses simge" data-ses="${esc(x.cevap)}" aria-label="Dinle" title="Dinle">${SES_SVG}</button></div>
      ${x.not ? `<div class="small muted">${esc(x.not)}</div>` : ''}</li>`).join('')}</ol>` : ''}
    <div class="row">
      <button class="btn primary" id="tanitim-basla">Soruya geç <kbd>Enter</kbd></button>
      <button class="btn" id="tanitim-biliyorum" type="button" title="Bu kural konusunu olgun olarak kaydet">Zaten biliyorum</button>
    </div>
  </div>`;
  $('#cik').onclick = oturumdanCik;
  $('#konu')?.addEventListener('click', () => konuAc(kart.unite));
  $('#tanitim-biliyorum').onclick = () => zatenBiliyorum(kart, oge);
  document.querySelectorAll('[data-ses]').forEach(b => b.onclick = () => seslendir(b.dataset.ses));
  const basla = $('#tanitim-basla');
  basla.onclick = () => { o.tanitildi.add(kart.id); window.scrollTo(0, 0); kartGoster(); };
  basla.focus({ preventScroll: true });
}

// Tanıtılan yeni kelime kuyruğun başından çıkarılır ve en çok 4 kart sonra asıl soru olarak döner.
// kalan: tanıtılan kart çıkarıldıktan sonraki kuyruk uzunluğu.
function tanitimSonrasiYer(kalan) {
  return Math.min(4, kalan);
}

// Yeni kelime/kalıp ilk kez geldiğinde: Almancası, anlamı ve sesi gösterilir; bir kez yazılır. Kayıt yazılmaz.
function kelimeTanit(kart, oge) {
  const o = D.oturum;
  o.aktif = null;
  $('#app').innerHTML = `
  <div class="topline"><button class="btn small" id="cik" title="Esc">Çık</button><span class="small muted">Yeni ${kart.tur === 'kalip' ? 'kalıp' : 'kelime'} tanıtımı</span></div>
  <div class="panel kart">
    <div class="meta">
      <span class="chip new">yeni</span>
      <span class="chip">${TUR_AD[kart.tur]}</span>
      <span class="chip" title="${esc(kart.unite.baslik)}">${esc(uniteEtiketi(kart.unite))}</span>
      <span style="margin-left:auto"></span>
      ${kart.unite.konu ? '<button class="btn small" id="konu">' + IKON.kitap + ' Konu</button>' : ''}
    </div>
    <div class="tanitim-baslik"><b lang="de">${artikelRenklendir(oge.cevap)}</b> <button class="ses simge" id="ses-tanit" aria-label="Dinle" title="Dinle">${SES_SVG}</button></div>
    <div>${esc(oge.soru)}</div>
    ${oge.not ? `<div class="small muted">${esc(oge.not)}</div>` : ''}
    <p class="small muted">Bir kez yaz. Asıl soru birkaç kart sonra gelecek; puanı o zaman verilir.</p>
    <input class="giris" id="giris" aria-label="Bir kez yaz" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" lang="de" maxlength="1000" placeholder="Bir kez yaz…">
    <div class="umlaut">${['ä', 'ö', 'ü', 'ß', 'Ä', 'Ö', 'Ü'].map(c => `<button tabindex="-1" data-c="${c}">${c}</button>`).join('')}</div>
    <p class="small" id="tanit-durum" role="status"></p>
    <div class="row">
      <button class="btn primary" id="tanit-tamam">Devam <kbd>Enter</kbd></button>
      <button class="btn" id="tanit-gec">Geç</button>
      <button class="btn" id="tanit-biliyorum" type="button" title="Bu kartı olgun olarak kaydet">Zaten biliyorum</button>
    </div>
  </div>`;
  const giris = $('#giris');
  const devam = () => {
    o.tanitildi.add(kart.id);
    o.kuyruk.shift();
    o.kuyruk.splice(tanitimSonrasiYer(o.kuyruk.length), 0, kart);
    o.secilen = null;
    window.scrollTo(0, 0);
    kartGoster();
  };
  const dene = () => {
    if (['dogru', 'harf', 'umlaut', 'umlautEksik'].includes(denetle(oge, giris.value).kod)) return devam();
    $('#tanit-durum').textContent = N(giris.value) ? 'Tam olarak bu değil. Yukarıdaki yazılışa bakıp tekrar dene ya da Geç.' : 'Önce yaz ya da Geç.';
    giris.focus();
  };
  $('#cik').onclick = oturumdanCik;
  $('#konu')?.addEventListener('click', () => konuAc(kart.unite));
  $('#ses-tanit').onclick = () => seslendir(dikteMetni(oge));
  document.querySelectorAll('.umlaut button').forEach(b => {
    b.addEventListener('mousedown', e => e.preventDefault());
    b.addEventListener('click', () => {
      const s = giris.selectionStart ?? giris.value.length, e = giris.selectionEnd ?? s;
      giris.value = giris.value.slice(0, s) + b.dataset.c + giris.value.slice(e);
      giris.setSelectionRange(s + 1, s + 1); giris.focus();
    });
  });
  $('#tanit-tamam').onclick = dene;
  $('#tanit-gec').onclick = devam;
  $('#tanit-biliyorum').onclick = () => zatenBiliyorum(kart, oge);
  giris.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.repeat && !e.isComposing) { e.preventDefault(); e.stopPropagation(); dene(); }
  });
  giris.focus({ preventScroll: true });
  if (D.ayar.sesOto && sesVar()) seslendir(dikteMetni(oge));   // ses düğmesi her zaman var
}

// "Cevabım da doğru": itiraz geri-bildirim/itirazlar.jsonl dosyasına yazılır; ajan inceleyip geçerliyse alternatif ekler.
async function itirazEt(a, btn) {
  btn.disabled = true;
  const kayit = { t: new Date().toISOString(), c: a.kart.id, i: a.oge.id, dosya: a.kart.unite.dosya, satir: a.oge.satir || 0,
    bolum: a.kart.baslik || TUR_AD[a.kart.tur], soru: a.oge.soru || a.oge.iskelet || '', girdi: a.girdi, beklenen: a.oge.cevap };
  try { await api('/api/itiraz', kayit); }
  catch { btn.disabled = false; return toast('Bildirim kaydedilemedi'); }
  btn.textContent = 'Bildirildi ✓';
  a.itiraz = true;
  toast('Not alındı. Ajan inceleyip geçerliyse kabul edilen cevaplara ekleyecek.', 3500);
  if (D.oturum?.pratik) { a.sonuc.kod = 'dogru'; return; }
  a.oneri = 3;
  document.querySelectorAll('.puan button').forEach(b => {
    if (+b.dataset.g >= 3) b.disabled = false;
    b.classList.toggle('oneri', +b.dataset.g === 3);
  });
  const uyariEl = $('.bos-uyari');
  if (uyariEl) { uyariEl.hidden = true; uyariEl.remove?.(); }
  $('.puan .oneri')?.focus({ preventScroll: true });
}

function benzerSoruyuSec(a) {
  if (a.kart.tur !== 'kural' || a.benzerYapildi || a.sonuc.kod === 'dogru') return null;
  const soru = oge => N(oge.soru || oge.iskelet).toLowerCase();
  const onceki = soru(a.oge), st = D.durum.get(a.kart.id), son = st?.ogeSon || {}, puan = st?.ogePuan || {};
  const gorulen = turGorulduOku(a.kart.id);
  const kova = x => puan[x.id] <= 2 ? 0 : son[x.id] === undefined ? (gorulen.has(x.id) ? 2 : 1) : 3;
  const uretim = x => (tamCumleMi(x) ? 0 : 1);
  const karma = x => fnv(`${a.kart.id}:benzer:${x.id}:${a.oge.id}:${st?.tekrar || 0}`);
  return a.kart.ogeler.filter(oge => soru(oge) !== onceki)
    .sort((x, y) => kova(x) - kova(y)
      || (son[x.id] ?? -1) - (son[y.id] ?? -1)
      || uretim(x) - uretim(y)
      || (karma(x) < karma(y) ? -1 : karma(x) > karma(y) ? 1 : 0))[0] || null;
}

function benzerdenDon() {
  const o = D.oturum;
  if (!o?.benzer) return;
  const tur = o.benzer;
  if (tur.tur) {
    const a = o.aktif;
    if (!a?.cevaplandi) return;
    if (a.sonuc.kod !== 'dogru' && !tur.tekrarlar.has(a.oge.id)) {
      tur.tekrarlar.add(a.oge.id);
      tur.sorular.push(a.oge);
    }
    tur.sira++;
    if (tur.sira >= tur.sorular.length) return kuralTuruBitir();
    tur.soru = { kart: tur.ana.kart, oge: tur.sorular[tur.sira] };
    window.scrollTo(0, 0);
    return kartGoster();
  }
  const ana = o.benzer.ana;
  o.benzer = null;
  window.scrollTo(0, 0);
  kartGoster(ana);
}

function kuralTuruBitir() {
  const o = D.oturum;
  if (!o?.benzer?.tur) return;
  o.benzer = null;
  window.scrollTo(0, 0);
  kartGoster();
}

function kuralTurSorulari(kart, oge, adet, ornekler = []) {
  if (!(adet > 0)) return [];
  const ornekIdler = new Set(ornekler);
  const st = D.durum.get(kart.id), son = st?.ogeSon || {}, puan = st?.ogePuan || {};
  const gorulen = turGorulduOku(kart.id);
  const kova = x => puan[x.id] <= 2 ? 0 : son[x.id] === undefined ? (gorulen.has(x.id) ? 2 : 1) : 3;
  const karma = x => fnv(`${kart.id}:tur:${x.id}:${st?.tekrar || 0}:${oge.id}`);
  const sirala = liste => liste.slice().sort((a, b) =>
    kova(a) - kova(b)
    || (son[a.id] ?? -1) - (son[b.id] ?? -1)
    || (karma(a) < karma(b) ? -1 : karma(a) > karma(b) ? 1 : 0));
  const adaylar = kart.ogeler.filter(x => x.id !== oge.id);
  const ana = sirala(adaylar.filter(x => !ornekIdler.has(x.id)));
  const yedek = sirala(adaylar.filter(x => ornekIdler.has(x.id)));
  const secilen = [], secilenSet = new Set();
  const ekle = x => { if (secilen.length < adet && !secilenSet.has(x.id)) { secilen.push(x); secilenSet.add(x.id); } };
  const tamAna = ana.filter(tamCumleMi);
  const hedefTam = Math.min(tamAna.length, Math.ceil(adet / 2));
  for (let i = 0; i < hedefTam; i++) ekle(tamAna[i]);
  for (const x of ana) ekle(x);
  if (secilen.length < adet) {
    const eksikTam = Math.max(0, Math.ceil(adet / 2) - secilen.filter(tamCumleMi).length);
    for (const x of yedek.filter(tamCumleMi).slice(0, eksikTam)) ekle(x);
    for (const x of yedek) ekle(x);
  }
  return secilen;
}

const BASLIK_GIRDI_SINIR = 40;   // daha uzun girdi başlığa sığmaz; "Senin cevabın" fark satırında gösterilir

// Yanlış/neredeyse cevapta kısa girdi başlığa taşınır ("Yanlış — haben yazdın"); doğru, boş ve tanımada null.
function basliktakiGirdi(sonuc, girdi) {
  if (['dogru', 'bos', 'oz'].includes(sonuc.kod)) return null;
  const g = String(girdi ?? '').trim().replace(/\s+/g, ' ');
  return g && [...g].length <= BASLIK_GIRDI_SINIR ? g : null;
}

function sonucBaslik(sonuc, girdi) {
  const baslik = SONUC_YAZI[sonuc.kod][1];
  const g = basliktakiGirdi(sonuc, girdi);
  return g === null ? baslik : `${baslik} — <span class="yazdin" lang="de">${esc(g)}</span> yazdın`;
}

// Sonuç kutusu + Kural kutusu + katlanır Ayrıntı. Yanlış cevapta >> hatırlatmasının ilk satırı Kural kutusunda;
// not, kalan hatırlatma satırları, diğer kabul edilenler ve dikte anlamı Ayrıntı içinde. Kural kutusu yoksa
// yanlış cevabın notu (ve umlaut açıklaması) kutuda görünür kalır; doğru cevapta katlanır.
function sonucGovdesi(a) {
  const { girdi, sonuc, oge, kart } = a;
  const sinif = SONUC_YAZI[sonuc.kod][0];
  const tanima = oge.tip === 'tanima';
  const hatali = !['dogru', 'bos', 'oz'].includes(sonuc.kod);
  const gosterilen = sonuc.tam || oge.cevap;
  const fark = hatali ? farkHtml(girdi, sonuc.hedef) : null;
  const dogruHtml = fark && sonuc.hedef === gosterilen
    ? fark.dogru
    : (kart?.tur === 'kelime' ? artikelRenklendir(gosterilen) : esc(gosterilen));
  const digerleri = tanima ? [] : oge.cevaplar.filter(c => N(c) !== N(gosterilen));
  const hatirlatma = (kart?.hatirlatma || []).map(satirIci);
  const kuralVar = hatirlatma.length > 0 && sonuc.kod !== 'dogru' && sonuc.kod !== 'oz';
  const notAcik = sonuc.kod !== 'dogru' && !kuralVar;
  const buyukHarfNot = sonuc.kod === 'dogru' && !tanima && buyukHarfHatirlatmasiMi(girdi, sonuc.hedef || gosterilen, oge)
    ? '<div class="not">Hatırlatma: Almancada isimler ve resmî Sie büyük harfle başlar.</div>' : '';
  const notlar = (sonuc.kod === 'umlautEksik' ? '<div class="not">Umlaut kelimeyi ya da biçimi değiştirir (schon ≠ schön, hatte ≠ hätte, Mutter ≠ Mütter).</div>' : '') +
    (oge.not ? `<div class="not">${esc(oge.not)}</div>` : '');
  const kalanHatir = kuralVar ? hatirlatma.slice(1) : hatirlatma;
  const ayrinti = (notAcik ? '' : notlar) +
    (kalanHatir.length ? `<div class="hatir">${kalanHatir.join('<br>')}</div>` : '') +
    (digerleri.length && oge.tip !== 'bosluk' ? `<div class="alts">Diğer kabul edilenler <span lang="de">${digerleri.map(esc).join(' · ')}</span></div>` : '') +
    (oge.tip === 'dikte' ? `<div class="alts">Anlamı: ${esc(oge.soru)}</div>` : '');
  return `
    <div class="sonuc ${sinif}" aria-live="polite">
      <div class="baslik">${sonucBaslik(sonuc, girdi)}</div>
      ${fark && basliktakiGirdi(sonuc, girdi) === null ? `<div class="senin">Senin cevabın <span lang="de">${fark.senin}</span></div>` : ''}
      <div class="cevap"><span${tanima ? '' : ' lang="de"'}>${dogruHtml}</span> <button class="ses simge" id="ses" aria-label="Dinle" title="Dinle">${SES_SVG}</button></div>
      ${buyukHarfNot}
      ${notAcik ? notlar : ''}
    </div>
    ${kuralVar ? `<div class="kural"><span class="ik">Kural</span><p>${hatirlatma[0]}</p></div>` : ''}
    ${ayrinti ? `<details class="ayrinti"${sonuc.kod === 'dogru' ? ' open' : ''}><summary>Ayrıntı</summary>${ayrinti}</details>` : ''}`;
}

function sonucuGoster(o, a, sesAc = true) {
  const { sonuc, oge } = a;
  const giris = $('#giris');
  if (giris) { giris.blur(); giris.hidden = true; }
  if ($('.umlaut')) $('.umlaut').hidden = true;
  const tanima = oge.tip === 'tanima';
  const hatali = !['dogru', 'bos', 'oz'].includes(sonuc.kod);
  const bos = sonuc.kod === 'bos';
  const yanlisKilit = (sonuc.kod === 'yanlis' || sonuc.kod === 'umlautEksik') && !a.itiraz;
  const kilitli = bos || yanlisKilit;
  const kilitUnvan = bos ? 'Boş cevaba verilemez' : 'Yanlış cevaba verilemez';
  const gosterilen = sonuc.tam || oge.cevap;
  const sesMetni = tanima ? oge.soru : oge.tip === 'dikte' ? dikteMetni(oge) : gosterilen;
  const benzer = o.benzer || o.pratik ? null : benzerSoruyuSec(a);
  const puanlama = !o.pratik && !o.benzer && !o.eleme;
  const araliklar = puanlama ? [1, 2, 3, 4].map(g => sureYaz(onizle(a.kart, g))) : [];
  let altlik;
  if (puanlama) altlik = `<div class="puan">
      ${['Tekrar', 'Zor', 'İyi', 'Kolay'].map((ad, i) => `<button class="k${i + 1} ${a.oneri === i + 1 ? 'oneri' : ''}" data-g="${i + 1}"${kilitli && i >= 2 ? ` disabled title="${kilitUnvan}"` : ''}><b>${ad}</b><span>${araliklar[i]} · <kbd>${i + 1}</kbd></span></button>`).join('')}
    </div>
    ${bos ? '<p class="bos-uyari">Boş cevaba yalnızca <b>Tekrar</b> veya <b>Zor</b> verilebilir.</p>'
      : yanlisKilit ? '<p class="bos-uyari">Yanlış cevaba yalnızca <b>Tekrar</b> veya <b>Zor</b> verilebilir. Cevabın geçerliyse <b>Cevabım da doğru</b> de.</p>' : ''}`;
  else if (tanima && o.pratik) altlik = `<div class="row"><button class="btn primary" id="bildim">Bildim <kbd>Enter</kbd></button><button class="btn" id="bilemedim">Bilemedim</button></div>`;
  else altlik = `<button class="btn primary" id="sonraki">${o.benzer?.tur ? 'Sonraki soru' : o.benzer ? 'Asıl karta dön' : o.kuyruk.length === 1 ? 'Sonucu gör' : 'Sonraki soru'} <kbd>Enter</kbd></button>`;
  const aksiyonlar = (benzer ? '<button class="btn" id="benzer">Benzer soru</button>' : '') +
    (hatali && !a.itiraz ? '<button class="btn" id="itiraz">Cevabım da doğru</button>' : '') +
    (puanlama ? '<button class="btn" id="sonuc-biliyorum" type="button" title="Bu kartı olgun olarak kaydet">Zaten biliyorum</button>' : '');
  $('#alt').outerHTML = `${sonucGovdesi(a)}
    ${altlik}
    ${aksiyonlar ? `<div class="kart-aksiyonlar row">${aksiyonlar}</div>` : ''}`;
  $('#sonraki')?.addEventListener('click', o.benzer ? benzerdenDon : o.eleme ? elemeIlerle : pratikIlerle);
  $('#bildim')?.addEventListener('click', () => { a.sonuc.kod = 'dogru'; pratikIlerle(); });
  $('#bilemedim')?.addEventListener('click', () => { a.sonuc.kod = 'yanlis'; pratikIlerle(); });
  $('#itiraz')?.addEventListener('click', e => itirazEt(a, e.currentTarget));
  $('#sonuc-biliyorum')?.addEventListener('click', () => zatenBiliyorum(a.kart, a.oge));
  if (benzer) $('#benzer').onclick = () => {
    a.benzerYapildi = true;
    o.benzer = { ana: a, soru: { kart: a.kart, oge: benzer } };
    window.scrollTo(0, 0);
    kartGoster();
  };
  document.querySelectorAll('.puan button').forEach(b => b.onclick = () => puanla(+b.dataset.g));
  $('#ses').onclick = () => seslendir(sesMetni);
  if (sesAc && D.ayar.sesOto && !tanima) seslendir(sesMetni);
  (puanlama ? $('.puan .oneri') : $('#sonraki') || $('#bildim'))?.focus({ preventScroll: true });
}


function pratikIlerle() {
  const o = D.oturum, a = o?.aktif;
  if (!o?.pratik || !a?.cevaplandi || o.benzer) return;
  o.yapilan++;
  if (a.sonuc.kod === 'dogru') o.dogru++;
  else {
    const k = a.kart;
    const konu = `${uniteEtiketi(k.unite)} · ${k.baslik || TUR_AD[k.tur]}`;
    const hatalar = o.pratik.hatalar;
    hatalar.set(konu, (hatalar.get(konu) || 0) + 1);
  }
  o.kuyruk.shift();
  kartGoster();
}

// Tekrar kaydı: yanlış cevapta girdi metni `g` olarak eklenir (hata analizi için); doğru/öz değerlendirme/boş girdide eklenmez.
function kayitOlustur(a, g, simdi) {
  const id = Array.from(crypto.getRandomValues(new Uint8Array(16)), n => n.toString(16).padStart(2, '0')).join('');
  // Sunucu sınırları: 0 ≤ ms ≤ 1e8 (kart 27 saatten uzun açık kalabilir, saat geri gidebilir),
  // g en çok 200 kod noktası (UTF-16 ile kesmek vekil çiftini bölüp kaydı geçersiz kılardı).
  const ms = Number.isFinite(a.ms) ? Math.min(Math.max(0, Math.round(a.ms)), 1e8) : 0;
  const kayit = { id, t: new Date(simdi).toISOString(), c: a.kart.id, i: a.oge.id, r: g, ok: a.sonuc.kod, ms };
  const girdi = typeof a.girdi === 'string' ? a.girdi : '';
  if (!['dogru', 'oz', 'biliyorum'].includes(a.sonuc.kod) && girdi.trim()) kayit.g = [...girdi].slice(0, 200).join('');
  return kayit;
}

function biliniyorKaydet(kart, oge, ms = 0) {
  const kayit = kayitOlustur({ kart, oge, ms, sonuc: { kod: 'biliyorum' }, girdi: '' }, 4, Date.now());
  D.kayitlar.push(kayit);
  kayitUygula(kayit);
  kaydet(kayit);
  return kayit;
}

function zatenBiliyorum(hedefKart = null, hedefOge = null) {
  const o = D.oturum;
  if (!o || o.pratik || o.benzer || o.eleme) return;
  const a = o.aktif;
  if (a?.puanlandi) return;
  const kart = hedefKart || a?.kart || o.kuyruk[0];
  if (!kart) return;
  if (kart.tur === 'kural' && typeof window.confirm === 'function') {
    const sayi = kart.ogeler?.length || 0;
    if (!window.confirm(`„${kart.baslik}“ kural konusundaki tüm egzersizler (${sayi} soru) 1 yıl sonrasına ertelenecek. Emin misin?`)) return;
  }
  const oge = hedefOge || a?.oge || o.secilen?.oge || ogeSec(kart);
  if (a) a.puanlandi = true;
  o.uzat = false;
  o.secilen = null;
  o.geriAl = {
    eklenenIdler: [],
    kuyruk: [...o.kuyruk],
    yapilan: o.yapilan,
    ilkCevaplar: new Map(o.ilkCevaplar),
    sonOge: { ...o.sonOge },
  };
  const simdi = Date.now();
  const ms = a ? simdi - a.basla : 0;
  const kayit = biliniyorKaydet(kart, oge, ms);
  o.geriAl.eklenenIdler.push(kayit.id);
  o.yapilan++;
  if (!o.ilkCevaplar.has(kart.id)) o.ilkCevaplar.set(kart.id, { kart, oge, kod: 'dogru' });
  o.sonOge[kart.id] = oge.id;
  if (o.kuyruk[0] === kart) o.kuyruk.shift();
  else {
    const idx = o.kuyruk.indexOf(kart);
    if (idx >= 0) o.kuyruk.splice(idx, 1);
  }
  // Kalıp ↔ Dikte ikiz senkronizasyonu: aynı ünitedeki ikiz kart da otomatik olgun kaydedilir.
  let ikizKaydedildi = false;
  if (kart.tur === 'kalip' || kart.tur === 'dikte') {
    const hedefTur = kart.tur === 'kalip' ? 'dikte' : 'kalip';
    const ikiz = (kart.unite?.kartlar || []).find(k => k.tur === hedefTur && k.ogeler[0]?.cevap === oge.cevap);
    if (ikiz && kartDurumu(ikiz) !== 'olgun') {
      const ikizOge = ikiz.ogeler[0];
      const ikizKayit = biliniyorKaydet(ikiz, ikizOge);
      o.geriAl.eklenenIdler.push(ikizKayit.id);
      const ikizIdx = o.kuyruk.indexOf(ikiz);
      if (ikizIdx >= 0) o.kuyruk.splice(ikizIdx, 1);
      ikizKaydedildi = true;
    }
  }
  toast(ikizKaydedildi ? 'Kart ve dikte/kalıp ikizi „zaten biliyorum“ olarak kaydedildi' : 'Kart „zaten biliyorum“ olarak kaydedildi');
  window.scrollTo(0, 0);
  kartGoster();
}

function puanla(g) {
  const o = D.oturum, a = o?.aktif; if (!a || !a.cevaplandi || a.puanlandi || o.pratik || o.benzer || o.eleme) return;
  const bos = a.sonuc.kod === 'bos';
  const kilitli = bos || ((a.sonuc.kod === 'yanlis' || a.sonuc.kod === 'umlautEksik') && !a.itiraz);
  if (kilitli && g >= 3) {
    return toast(bos ? 'Boş cevaba İyi veya Kolay verilemez. Biliyorsan cevabı yazıp kontrol et.'
      : 'Yanlış cevaba İyi veya Kolay verilemez. Cevabın doğruysa „Cevabım da doğru“ düğmesini kullan.', 3500);
  }
  const yeniKural = !D.durum.has(a.kart.id);
  a.puanlandi = true;
  o.uzat = false;
  o.secilen = null;
  o.geriAl = {
    eklenenIdler: [],
    kuyruk: [...o.kuyruk],
    yapilan: o.yapilan,
    ilkCevaplar: new Map(o.ilkCevaplar),
    sonOge: { ...o.sonOge },
  };
  const kayit = kayitOlustur(a, g, Date.now());
  o.geriAl.eklenenIdler.push(kayit.id);
  D.kayitlar.push(kayit);
  kayitUygula(kayit);
  kaydet(kayit);
  o.yapilan++;
  const ilkKod = a.sonuc.kod === 'oz' ? (g >= 3 ? 'dogru' : 'yanlis') : a.itiraz ? 'dogru' : a.sonuc.kod;
  if (!o.ilkCevaplar.has(a.kart.id)) o.ilkCevaplar.set(a.kart.id, { kart: a.kart, oge: a.oge, kod: ilkKod });
  o.sonOge[a.kart.id] = a.oge.id;
  o.kuyruk.shift();
  if (g === 1) o.kuyruk.splice(Math.min(3, o.kuyruk.length), 0, a.kart);
  if (D.ayar.kuralTur !== false && a.kart.tur === 'kural' && (yeniKural || g <= 2)) {
    const sorular = kuralTurSorulari(a.kart, a.oge, yeniKural ? 5 : 3, o.tanitimOrnekleri?.get(a.kart.id));
    if (sorular.length) o.benzer = { tur: true, ana: a, sorular, sira: 0, tekrarlar: new Set(), soru: { kart: a.kart, oge: sorular[0] } };
  }
  kartGoster();
}

function sonKaydiGeriAl() {
  const o = D.oturum, g = o?.geriAl;
  if (!o || !g) return;
  if (!geriAlmayiKuyrugaEkle(g.eklenenIdler)) return toast('Geri alma tarayıcıya kaydedilemedi. Son işlem korunuyor; yeniden dene.', 5000);
  const silinecek = new Set(g.eklenenIdler);
  D.kayitlar = D.kayitlar.filter(l => !silinecek.has(l.id));
  for (const id of silinecek) kuyruktanSil(KAYIT_ONEK + 'id:' + id);
  kaydet();
  durumuKur();
  o.kuyruk = g.kuyruk;
  o.yapilan = g.yapilan;
  o.ilkCevaplar = g.ilkCevaplar;
  o.sonOge = g.sonOge;
  if (g.eleme) o.eleme = { ...g.eleme };
  o.uzat = true;
  o.secilen = null;
  o.geriAl = null;
  o.benzer = null;
  toast('Son işlem geri alındı');
  window.scrollTo(0, 0);
  kartGoster();
}

function bittiGeriAl() {
  if (!sonBitenOturum) return;
  const kurtarilan = sonBitenOturum;
  sonBitenOturum = null;
  D.oturum = kurtarilan;
  D.ekran = 'calis';
  $('header')?.classList?.add('odak-modu');
  document.body?.classList?.add('calisma-ekrani');
  sonKaydiGeriAl();
  if (D.oturum?.geriAl) { sonBitenOturum = D.oturum; D.oturum = null; }
}

function oturumOnerisi(cevaplar) {
  const konular = new Map();
  for (const { kart, oge, kod } of cevaplar) {
    if (kod === 'dogru') continue;
    const anahtar = kart.tur === 'kural' ? kart.id : kart.unite.id + ':' + kart.tur;
    if (!konular.has(anahtar)) konular.set(anahtar, { kart, yanlislar: new Set(), adet: 0 });
    const konu = konular.get(anahtar);
    konu.adet++;
    konu.yanlislar.add(oge);
  }
  const konu = [...konular.values()].sort((a, b) => b.adet - a.adet)[0];
  if (!konu) return null;
  const k = konu.kart;
  const kartlar = k.tur === 'kural' ? [k] : k.unite.kartlar.filter(c => c.tur === k.tur);
  const havuz = kartlar.flatMap(kart => kart.ogeler.map(oge => ({ kart, oge })));
  const sorular = havuz.filter(s => !konu.yanlislar.has(s.oge)).concat(havuz.filter(s => konu.yanlislar.has(s.oge))).slice(0, 5);
  return { baslik: `${uniteEtiketi(k.unite)} · ${k.baslik || TUR_AD[k.tur]}`, sorular };
}

function oturumBitti() {
  const o = D.oturum;
  sonBitenOturum = o?.geriAl && !o.pratik ? o : null;
  D.oturum = null;
  if (o?.eleme) {
    $('#app').innerHTML = `<div class="panel bitti"><h2>Kelime eleme tamamlandı</h2>
      <p>${o.eleme.bilinen} kelime biliniyor olarak işaretlendi, ${o.eleme.kalan} kelime çalışma kuyruğunda kaldı</p>
      <div class="row" style="justify-content:center">
        ${sonBitenOturum ? '<button class="btn" id="bitti-geri-al" type="button">' + IKON.geriAl + ' Son işlemi geri al</button>' : ''}
        <button class="btn primary" id="ana">Bugün’e dön</button>
      </div></div>`;
    $('#ana').onclick = () => ekranGoster('ana');
    $('#bitti-geri-al')?.addEventListener('click', bittiGeriAl);
    return;
  }
  if (o?.pratik) {
    const konular = [...o.pratik.hatalar].sort((a, b) => b[1] - a[1]).slice(0, 3);
    const yuzde = o.yapilan ? Math.round(100 * o.dogru / o.yapilan) : 0;
    $('#app').innerHTML = `<div class="panel bitti">
      <h1 class="ekran-baslik">${esc(o.pratik.baslik)}</h1>
      <div class="bitti-ozet">
        <div><b>${o.dogru} / ${o.yapilan}</b><span>doğru cevap</span></div>
        <div><b>%${yuzde}</b><span>başarı oranı</span></div>
      </div>
      ${konular.length ? `<p class="small muted">Yeniden bakabileceğin konular<br>${konular.map(([konu]) => esc(konu)).join('<br>')}</p>` : ''}
      <div class="row" style="justify-content:center">
        ${o.pratik.donus !== 'ana' ? `<button class="btn" id="pratik-tekrar">${o.pratik.donus === 'ilerleme' ? 'İlerlemeye dön' : 'Konu seçimine dön'}</button>` : ''}
        <button class="btn primary" id="ana">Bugün’e dön</button>
      </div>
    </div>`;
    $('#ana').onclick = () => ekranGoster('ana');
    const tekrar = $('#pratik-tekrar');
    if (tekrar) tekrar.onclick = () => ekranGoster(o.pratik.donus);
    return;
  }
  const dk = o ? Math.max(1, Math.round((Date.now() - o.basla) / 6e4)) : 0;
  const ilk = [...(o?.ilkCevaplar?.values() || [])];
  const dogru = ilk.filter(x => x.kod === 'dogru').length;
  const oneri = oturumOnerisi(ilk);
  $('#app').innerHTML = `<div class="panel bitti">
    <h1 class="ekran-baslik">${o?.kuyruk.length ? 'Kısa oturum tamamlandı' : 'Çalışma tamamlandı'}</h1>
    <div class="bitti-ozet">
      <div><b>${o?.yapilan || 0}</b><span>cevap</span></div>
      <div><b>${dk} dk</b><span>oturum süresi</span></div>
      ${ilk.length ? `<div><b>${dogru} / ${ilk.length}</b><span>ilk cevapta doğru</span></div>` : ''}
    </div>
    ${oneri ? `<p class="small muted">Sıradaki pratik · ${esc(oneri.baslik)}</p>` : ''}
    <div class="row" style="justify-content:center">
      ${sonBitenOturum ? '<button class="btn" id="bitti-geri-al" type="button">' + IKON.geriAl + ' Son kartı geri al</button>' : ''}
      ${oneri ? `<button class="btn primary" id="oturum-pratik">Bu konudan ${oneri.sorular.length} soru çöz</button>` : ''}
      <button class="btn${oneri ? '' : ' primary'}" id="ana">Bugün’e dön</button>
    </div>
  </div>`;
  $('#ana').onclick = () => ekranGoster('ana');
  $('#bitti-geri-al')?.addEventListener('click', bittiGeriAl);
  if (oneri) $('#oturum-pratik').onclick = () => pratikBaslat(oneri.sorular, oneri.baslik, 'ana');
}

// ------------------------------------------------------------ klavye & tema
const TEMA_ANAHTAR = 'almanca-tema';
function temaUygula(secim) {
  if (document.documentElement?.setAttribute) {
    if (secim === 'light' || secim === 'dark') document.documentElement.setAttribute('data-theme', secim);
    else document.documentElement.removeAttribute('data-theme');
  }
  const btn = $('#tema-btn');
  if (btn) {
    btn.innerHTML = secim === 'dark' ? IKON.ay : secim === 'light' ? IKON.gunes : IKON.otoTema;
    const etiket = secim === 'dark' ? 'Koyu tema etkin (değiştirmek için tıkla)'
      : secim === 'light' ? 'Açık tema etkin (değiştirmek için tıkla)'
      : 'Sistem teması etkin (değiştirmek için tıkla)';
    btn.title = etiket;
    btn.setAttribute?.('aria-label', etiket);
  }
}
try { temaUygula(localStorage.getItem(TEMA_ANAHTAR)); } catch {}
$('#tema-btn')?.addEventListener('click', () => {
  const mevcut = document.documentElement.getAttribute('data-theme');
  const koyuMu = mevcut ? mevcut === 'dark' : window.matchMedia?.('(prefers-color-scheme: dark)').matches;
  const yeni = koyuMu ? 'light' : 'dark';
  try { localStorage.setItem(TEMA_ANAHTAR, yeni); } catch {}
  temaUygula(yeni);
});

document.addEventListener('keydown', e => {
  if (document.querySelector('.modal')) return;
  if (D.ekran === 'ana' && e.key === 'Enter' && e.target === document.body && $('#basla')) { e.preventDefault(); oturumBaslat(true); return; }
  if (D.ekran !== 'calis') return;
  const o = D.oturum, a = o?.aktif;
  if (e.key === 'Escape') { oturumdanCik(); return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !e.shiftKey && (o?.geriAl || sonBitenOturum) && (!e.target.matches?.('input') || !e.target.value)) {
    e.preventDefault();
    if (o?.geriAl) sonKaydiGeriAl(); else bittiGeriAl();
    return;
  }
  if (e.altKey && !e.ctrlKey && !e.metaKey && !e.repeat && a && !a.cevaplandi && a.kart?.tur === 'dikte') {
    const tus = e.key.toLowerCase();
    if (tus === 'r') { e.preventDefault(); seslendir(dikteMetni(a.oge)); return; }
    if (tus === 'y') { e.preventDefault(); seslendir(dikteMetni(a.oge), 0.7); return; }
  }
  if (e.altKey && e.key.toLowerCase() === 'b' && !o?.pratik && !o?.benzer) {
    e.preventDefault(); zatenBiliyorum(); return;
  }
  if (o?.artikelModu && a && !a.cevaplandi && !e.repeat && ['1', '2', '3'].includes(e.key)) {
    e.preventDefault(); artikelCevapla(['der', 'die', 'das'][+e.key - 1]); return;
  }
  if (!a?.cevaplandi) return;
  if (!e.repeat && (e.key === 'r' || e.key === 'R') && !e.ctrlKey && !e.metaKey && !e.altKey) {
    e.preventDefault(); $('#ses')?.click(); return;
  }
  if (o.pratik || o.benzer || o.eleme) {
    if (e.key === 'Enter' && !e.repeat && !e.target.closest?.('button, summary')) {
      e.preventDefault();
      if (o.benzer) benzerdenDon();
      else if (o.eleme) elemeIlerle();
      else { if (a.sonuc?.kod === 'oz') a.sonuc.kod = 'dogru'; pratikIlerle(); }
    }
    return;
  }
  if (!e.repeat && e.key >= '1' && e.key <= '4') { e.preventDefault(); puanla(+e.key); }
  else if (!e.repeat && e.key === 'Enter' && !e.target.closest?.('button, summary')) { e.preventDefault(); puanla(a.oneri); }
});
document.querySelectorAll('#nav button').forEach(b => b.onclick = () => { D.oturum = null; ekranGoster(b.dataset.ekran); });

// ------------------------------------------------------------ açılış
async function basla() {
  if (location.protocol === 'file:') {
    $('#app').innerHTML = `<div class="panel"><b>Bu sayfa doğrudan açılamaz.</b>
      <p>Klasördeki <code>calis.cmd</code> dosyasına çift tıkla; tarayıcı <code>http://localhost:8077</code> adresinde açılır.</p></div>`;
    return;
  }
  if (globalThis.senkron) await globalThis.senkron.baslat();
  kuyruguOku();
  kayitDurumunuGoster();
  try {
    const [icerik, kayitlar, ayar] = await Promise.all([api('/api/icerik'), api('/api/tekrarlar'), api('/api/ayarlar')]);
    Object.assign(D.ayar, ayar || {});
    D.uyarilar = [];
    D.uniteler = icerik.map(f => uniteAyristir(f.ad, f.metin));
    D.kartlar = new Map(); D.sira = [];
    for (const u of D.uniteler) for (const k of u.kartlar) { D.kartlar.set(k.id, k); D.sira.push(k); }
    kayitlariYukle(kayitlar);
    kayitHazir = true;
    kayitHata = false;
    kayitDurumunuGoster();
    ekranGoster('ana');
    kaydet();
    globalThis.senkron?.acilisSonrasi?.(async (manuel) => {
      const [yeniKayitlar, yeniAyar] = await Promise.all([api('/api/tekrarlar'), api('/api/ayarlar')]);
      Object.assign(D.ayar, yeniAyar || {});
      kayitlariYukle(yeniKayitlar);
      if (manuel || D.ekran !== 'calis') ekranGoster(D.ekran);
    }, D.ayar);
  } catch (e) {
    kayitHata = true;
    kayitDurumunuGoster();
    $('#app').innerHTML = `<div class="panel"><b>Sunucuya ulaşılamadı.</b><p class="muted">calis.cmd ile başlattığından emin ol. (${esc(e.message)})</p></div>`;
  }
}
document.addEventListener('DOMContentLoaded', basla);
