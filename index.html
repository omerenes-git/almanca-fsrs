<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#9f1239">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Almanca FSRS">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<title>Almanca FSRS</title>
<style>
:root{
  --radius-sm:8px; --radius:12px; --radius-lg:16px;
}
:root, :root[data-theme="light"]{
  color-scheme:light;
  --bg:#f2f4f7; --bg-subtle:#e7ebf1; --panel:#ffffff; --panel-2:#f8fafc;
  --ink:#111b29; --muted:#4d5d73; --line:#d6dde8; --line-strong:#bcc7d6;
  --acc:#1b4fd8; --acc-hover:#1641b5; --acc-ink:#ffffff;
  --acc-soft:color-mix(in srgb,var(--acc) 10%,var(--panel));
  --ok:#136f45; --ok-bg:#eaf6f0; --ok-border:#bce3cf;
  --warn:#8a5000; --warn-bg:#fef3de; --warn-border:#f3d295;
  --bad:#b42b22; --bad-bg:#fdeceb; --bad-border:#f4c2be;
  --chip:#e8eef6;
  --shadow-sm:0 1px 2px rgba(15,27,45,.05);
  --shadow:0 4px 16px -2px rgba(15,27,45,.06),0 1px 3px rgba(15,27,45,.04);
  --shadow-card:0 14px 34px -10px rgba(15,27,45,.10),0 2px 6px rgba(15,27,45,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#10151c; --bg-subtle:#161d27; --panel:#1b2431; --panel-2:#212c3c;
    --ink:#ecf2f9; --muted:#9fb0c7; --line:#2c3a4e; --line-strong:#3d4f69;
    --acc:#82aeff; --acc-hover:#9bc0ff; --acc-ink:#0d1d42;
    --acc-soft:color-mix(in srgb,var(--acc) 12%,var(--panel));
    --ok:#6ee2a8; --ok-bg:#172e27; --ok-border:#255243;
    --warn:#f4ba62; --warn-bg:#2e2312; --warn-border:#57401c;
    --bad:#f69389; --bad-bg:#321d20; --bad-border:#5c3136;
    --chip:#253245;
    --shadow-sm:0 1px 2px rgba(0,0,0,.28);
    --shadow:0 8px 24px -6px rgba(0,0,0,.38),0 1px 3px rgba(0,0,0,.24);
    --shadow-card:0 18px 42px -10px rgba(0,0,0,.52),0 2px 8px rgba(0,0,0,.32);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#10151c; --bg-subtle:#161d27; --panel:#1b2431; --panel-2:#212c3c;
  --ink:#ecf2f9; --muted:#9fb0c7; --line:#2c3a4e; --line-strong:#3d4f69;
  --acc:#82aeff; --acc-hover:#9bc0ff; --acc-ink:#0d1d42;
  --acc-soft:color-mix(in srgb,var(--acc) 12%,var(--panel));
  --ok:#6ee2a8; --ok-bg:#172e27; --ok-border:#255243;
  --warn:#f4ba62; --warn-bg:#2e2312; --warn-border:#57401c;
  --bad:#f69389; --bad-bg:#321d20; --bad-border:#5c3136;
  --chip:#253245;
  --shadow-sm:0 1px 2px rgba(0,0,0,.28);
  --shadow:0 8px 24px -6px rgba(0,0,0,.38),0 1px 3px rgba(0,0,0,.24);
  --shadow-card:0 18px 42px -10px rgba(0,0,0,.52),0 2px 8px rgba(0,0,0,.32);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
::selection{background:color-mix(in srgb,var(--acc) 22%,transparent);color:var(--ink)}
html{scrollbar-color:var(--line-strong) transparent;scroll-padding-top:72px}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.5 'Inter','Segoe UI Variable','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
  -webkit-text-size-adjust:100%;text-rendering:optimizeLegibility}
button,input,select{font:inherit;color:inherit}
input,textarea{caret-color:var(--acc)}
h1,h2,h3,.ekran-baslik,.tanitim-baslik{text-wrap:balance}
p{text-wrap:pretty}
.ilr-durum{font-size:12px;border-radius:99px;padding:2px 9px;background:var(--chip);color:var(--muted);white-space:nowrap;font-weight:500}
.ilr-durum.d-devam{background:var(--warn-bg);color:var(--warn)}
.ilr-durum.d-pekisti{background:var(--ok-bg);color:var(--ok)}

/* üst çerçeve & gezinme */
header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);transition:background-color .15s,border-color .15s}
.bar{max-width:780px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.logo{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:1.05rem;letter-spacing:-.02em;margin-right:auto;color:var(--ink)}
.logo svg{width:20px;height:20px;color:var(--acc);flex:none}
#nav{display:inline-flex;align-items:center;gap:2px;background:var(--bg-subtle);padding:3px;border-radius:11px;border:1px solid var(--line)}
nav button{background:none;border:0;padding:6px 11px;border-radius:8px;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:500;transition:color .15s,background-color .15s,box-shadow .15s;white-space:nowrap}
nav button svg{width:15px;height:15px;flex:none;opacity:.85}
nav button:hover{color:var(--ink)}
nav button.on{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:var(--shadow-sm)}
nav button.on svg{color:var(--acc);opacity:1}
.bar-sag{display:flex;align-items:center;gap:8px;flex:none}
.kayit-rozet{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:99px;border:1px solid var(--line);background:var(--panel);font-size:12px;font-weight:500;color:var(--muted);white-space:nowrap}
.kayit-rozet .rozet-nokta{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.kayit-rozet.durum-ok .rozet-nokta{background:var(--ok)}
.kayit-rozet.durum-bekliyor{border-color:var(--warn-border);background:var(--warn-bg);color:var(--warn)}
.kayit-rozet.durum-bekliyor .rozet-nokta{background:var(--warn)}
.kayit-rozet.durum-uyari{border-color:var(--bad-border);background:var(--bad-bg);color:var(--bad)}
.kayit-rozet.durum-uyari .rozet-nokta{background:var(--bad)}
.kayit-bari{max-width:780px;margin:0 auto;padding:6px 16px 8px;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);background:color-mix(in srgb,var(--warn-bg) 55%,transparent)}
.kayit-bari:not(.dikkat){display:none}
.kayit-bari .btn{padding:3px 10px;font-size:12px}
.kayit-bari .uyari-renk{color:var(--warn);font-weight:500}
.tema-btn{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:9px;width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--shadow-sm);transition:color .15s,border-color .15s,background-color .15s}
.tema-btn svg{width:17px;height:17px}
.tema-btn:hover{color:var(--ink);border-color:var(--line-strong)}
header.odak-modu #nav{display:none}
header.odak-modu .bar{padding-block:8px}

main{max-width:780px;margin:0 auto;padding:22px 16px 80px}
body.calisma-ekrani main{padding-top:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-lg);padding:22px;box-shadow:var(--shadow)}
.panel+.panel{margin-top:16px}
h2{font-size:1.0625rem;margin:0 0 12px;color:var(--ink);font-weight:650;letter-spacing:-.015em}
.ekran-baslik{margin:0;font-size:clamp(24px,4.5vw,32px);line-height:1.18;letter-spacing:-.025em;font-weight:700}

/* Bugün bento */
.bugun-panel{display:grid;gap:16px}
.seri-rozet{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:var(--ok-bg);border:1px solid var(--ok-border);color:var(--ok);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.bugun-hedef{display:flex;gap:18px;align-items:center}
.bugun-bilgi{display:grid;gap:6px;min-width:0;flex:1}
.bugun-ozet{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0}
.metrik-hap{display:inline-flex;align-items:baseline;gap:4px;padding:3px 10px;border-radius:99px;background:var(--bg-subtle);border:1px solid var(--line);font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.metrik-hap b{color:var(--ink);font-weight:650}
.bugun-sayac{margin:0;font-variant-numeric:tabular-nums}
.yuk-uyari{margin:0;color:var(--warn);font-weight:500}
.halka{--p:0;width:82px;height:82px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--ok) calc(var(--p) * 360deg),var(--bg-subtle) 0);box-shadow:inset 0 0 0 1px var(--line)}
.halka span{width:64px;height:64px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;box-shadow:var(--shadow-sm)}
.seri-gun{display:flex;gap:5px;margin-top:2px}
.seri-gun i{width:19px;height:19px;border-radius:6px;background:var(--bg-subtle);border:1px solid var(--line)}
.seri-gun i.v{background:var(--ok);border-color:var(--ok)}
.bugun-dugmeler{display:grid;gap:10px}
.oneri-ayar-kutu{background:var(--acc-soft);border:1px solid color-mix(in srgb,var(--acc) 28%,var(--line));border-radius:var(--radius);padding:12px 14px;display:grid;gap:8px}
.oneri-ayar-kutu p{margin:0;font-size:14px}
.konu hr{border:0;border-top:1px solid var(--line);margin:24px 0 18px}
.konu h4{font-size:16px;margin:16px 0 6px}
.yazma-gorev{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius);padding:12px 15px;margin:12px 0}
.yazma-gorev h4:first-child{margin-top:0}
.bugun-alt-izgara{margin-top:16px}
.bugun-alt-izgara.ikili{display:grid;grid-template-columns:1fr;gap:16px}
.bugun-alt-izgara .panel+.panel{margin-top:0}
@media (min-width:660px){.bugun-alt-izgara.ikili{grid-template-columns:1.15fr .85fr;align-items:start}}
.dun-ozet{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:12px}
.dun-ozet div{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;min-width:0}
.dun-ozet b{display:block;font-size:1.3em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.bugun-ozet .sure{white-space:nowrap}
.pratik-dugmeler{display:grid;gap:8px}
.pratik-btn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;justify-content:flex-start;font-weight:500;background:var(--panel-2)}
.pratik-btn svg{width:16px;height:16px;color:var(--acc);flex:none}
@media (max-width:420px){.dun-ozet{gap:6px}.dun-ozet div{padding:8px}.dun-ozet b{font-size:1.1em}}

.muted{color:var(--muted)} .small{font-size:14px}
.btn{border:1px solid var(--line-strong);background:var(--panel);padding:9px 15px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:500;transition:border-color .14s,background-color .14s,transform .08s,box-shadow .14s}
.btn.small{padding:6px 11px;font-size:13px;border-radius:var(--radius-sm)}
.btn:hover:not(:disabled){border-color:var(--muted);background:var(--panel-2)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:focus-visible,nav button:focus-visible,.tema-btn:focus-visible,.unite-sekmeler button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:600;box-shadow:var(--shadow-sm)}
.btn.primary:hover:not(:disabled){background:var(--acc-hover);border-color:var(--acc-hover)}
.btn.primary-soft{background:var(--acc-soft);border-color:color-mix(in srgb,var(--acc) 30%,var(--line));color:var(--acc);font-weight:600}
.btn.primary-soft:hover:not(:disabled){border-color:var(--acc)}
.btn.big{width:100%;padding:15px 18px;font-size:17px;border-radius:var(--radius)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.prog{height:8px;background:var(--bg-subtle);border-radius:99px;overflow:hidden;display:flex}
.prog i{display:block;height:100%;transition:width .25s ease-out}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:8px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}
.forecast{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:92px;margin-top:6px}
.forecast div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:12px;color:var(--muted)}
.forecast i{display:block;width:70%;background:var(--acc);border-radius:4px 4px 0 0;min-height:2px;opacity:.78}
.forecast b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}

/* çalışma kartı — Karteikarte odak sahnesi */
.topline{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.topline .prog{flex:1}
.topline .muted{font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;background:var(--chip);border-radius:99px;padding:3px 10px;font-size:13px;color:var(--muted);font-weight:500}
.chip.new{background:var(--acc-soft);color:var(--acc);border:1px solid color-mix(in srgb,var(--acc) 25%,var(--line));font-weight:600}
@keyframes kartGiris{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.kart{scroll-margin-block:12px;animation:kartGiris .16s ease-out;padding:26px 28px;box-shadow:var(--shadow-card)}
.kart .meta{display:flex;gap:7px;align-items:center;flex-wrap:wrap;padding-bottom:12px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.talimat{color:var(--muted);font-size:14px;margin:4px 0 0}
.soru{font-size:clamp(22px,4.5vw,28px);line-height:1.38;margin:14px 0 18px;font-weight:600;letter-spacing:-.015em;overflow-wrap:anywhere}
.soru .bos{display:inline-block;min-width:3.4em;background:var(--acc-soft);border-bottom:2.5px solid var(--acc);border-radius:6px 6px 2px 2px;padding:0 .35em;margin:0 .15em;color:transparent}
.soru .ipucu{color:var(--muted);font-size:.7em;font-weight:400}
.art{font-weight:700;border-radius:6px;padding:1px 6px}
.art-der{color:#1b4fd8;background:color-mix(in srgb,#1b4fd8 11%,var(--panel))}
.art-die{color:#b82433;background:color-mix(in srgb,#b82433 11%,var(--panel))}
.art-das{color:#117044;background:color-mix(in srgb,#117044 11%,var(--panel))}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .art-der{color:#82b4ff;background:color-mix(in srgb,#82b4ff 15%,var(--panel))}
  :root:not([data-theme="light"]) .art-die{color:#ff8f99;background:color-mix(in srgb,#ff8f99 15%,var(--panel))}
  :root:not([data-theme="light"]) .art-das{color:#6ce0a6;background:color-mix(in srgb,#6ce0a6 15%,var(--panel))}
}
:root[data-theme="dark"] .art-der{color:#82b4ff;background:color-mix(in srgb,#82b4ff 15%,var(--panel))}
:root[data-theme="dark"] .art-die{color:#ff8f99;background:color-mix(in srgb,#ff8f99 15%,var(--panel))}
:root[data-theme="dark"] .art-das{color:#6ce0a6;background:color-mix(in srgb,#6ce0a6 15%,var(--panel))}
.artikel-secim{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.artikel-secim button{padding:14px 8px;border:1.5px solid var(--line-strong);border-bottom-width:3px;border-radius:var(--radius);background:var(--panel);font-size:19px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s,border-color .12s,background-color .12s}
.artikel-secim button:hover{border-color:var(--acc);background:var(--panel-2)}
.artikel-secim button:active{transform:translateY(1px);border-bottom-width:2px}
.giris{width:100%;font-size:19px;padding:14px 16px;border:1.5px solid var(--line-strong);border-radius:var(--radius);background:var(--panel-2);outline:none;transition:border-color .15s,box-shadow .15s,background-color .15s}
.giris:focus{border-color:var(--acc);background:var(--panel);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 18%,transparent)}
.giris[readonly]{opacity:.9}
.umlaut{display:flex;gap:6px;margin:10px 0 16px;flex-wrap:wrap}
.umlaut button{flex:1;max-width:48px;min-width:38px;height:40px;padding:0;border:1px solid var(--line-strong);border-bottom-width:2px;background:var(--panel-2);border-radius:var(--radius-sm);cursor:pointer;font-size:16px;font-weight:600;box-shadow:0 1px 0 var(--line-strong);transition:transform .06s,background-color .12s,border-color .12s}
.umlaut button:hover{background:var(--panel);border-color:var(--acc)}
.umlaut button:active{transform:translateY(1px);border-bottom-width:1px;box-shadow:none}
.sonuc{border-radius:var(--radius);padding:15px 17px;margin:14px 0;border:1px solid var(--line);overflow-wrap:anywhere}
.sonuc.ok{background:var(--ok-bg);border-color:var(--ok-border)}
.sonuc.mid{background:var(--warn-bg);border-color:var(--warn-border)}
.sonuc.bad{background:var(--bad-bg);border-color:var(--bad-border)}
.sonuc .baslik{font-weight:700;margin-bottom:6px}
.ok .baslik{color:var(--ok)} .mid .baslik{color:var(--warn)} .bad .baslik{color:var(--bad)}
.cevap{font-size:21px;font-weight:600;margin:4px 0;display:flex;align-items:center;flex-wrap:wrap;gap:4px}
.senin{font-size:16px;margin:2px 0 6px;color:var(--muted)}
.senin del{color:var(--bad);text-decoration:line-through}
.cevap ins{text-decoration:none;background:color-mix(in srgb,var(--ok) 22%,transparent);border-radius:4px;padding:0 3px}
.not{font-size:15px;margin-top:8px}
.alts{font-size:14px;color:var(--muted)}
.sonuc .yazdin{font-weight:600}
.hatir{border-top:1px solid var(--line);margin-top:8px;padding-top:6px}
.kural{display:flex;gap:10px;align-items:flex-start;background:var(--acc-soft);border:1px solid color-mix(in srgb,var(--acc) 26%,var(--line));border-radius:var(--radius);padding:12px 14px;margin:12px 0;overflow-wrap:anywhere}
.kural .ik{font-size:11px;font-weight:700;color:var(--acc);background:var(--panel);border:1px solid color-mix(in srgb,var(--acc) 24%,var(--line));padding:2px 8px;border-radius:99px;letter-spacing:.03em;white-space:nowrap;margin-top:1px}
.kural p{margin:0;font-size:15px}
details.ayrinti{margin:10px 0 0;font-size:14px;overflow-wrap:anywhere;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:8px 12px}
details.ayrinti summary{cursor:pointer;color:var(--muted);font-weight:500}
details.ayrinti summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:4px}
details.ayrinti .not{font-size:14px;margin-top:6px}
details.ayrinti .alts{margin-top:6px}
.bos-uyari{font-size:13px;color:var(--muted);margin:8px 0 0}
.kart-aksiyonlar{margin-top:12px}
.puan{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.puan button{border:1px solid var(--line-strong);border-bottom-width:3px;background:var(--panel);border-radius:var(--radius);padding:11px 6px;cursor:pointer;line-height:1.25;transition:transform .08s,border-color .12s,background-color .12s}
.puan button:hover:not(:disabled){background:var(--panel-2)}
.puan button:active:not(:disabled){transform:translateY(1px);border-bottom-width:2px}
.puan button b{display:block;font-size:15px}
.puan button span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.puan button.oneri{border-width:2px;border-bottom-width:3px;border-color:var(--acc);background:var(--acc-soft)}
.puan .k1{border-bottom-color:var(--bad)} .puan .k2{border-bottom-color:var(--warn)} .puan .k3{border-bottom-color:var(--ok)} .puan .k4{border-bottom-color:var(--acc)}
.puan .k1 b{color:var(--bad)} .puan .k2 b{color:var(--warn)} .puan .k3 b{color:var(--ok)} .puan .k4 b{color:var(--acc)}
.ses{border:0;background:none;cursor:pointer;padding:0 4px;vertical-align:middle}
.btn svg{width:16px;height:16px;flex:none}

.ses.simge svg{width:16px;height:16px}
.ses.simge:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
kbd{font:11.5px ui-monospace,SFMono-Regular,Consolas,monospace;background:var(--bg-subtle);border:1px solid var(--line);border-radius:5px;padding:1px 5px}

@media (hover:none){kbd{display:none}}

/* üniteler & ayarlar */
.unite-filtre{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0 14px}
.unite-sekmeler{display:flex;gap:5px;flex-wrap:wrap}
.unite-sekmeler button{border:1px solid var(--line);background:var(--panel-2);color:var(--muted);border-radius:99px;padding:5px 11px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:border-color .14s,background-color .14s,color .14s}
.unite-sekmeler button .say{font-size:11px;opacity:.8;font-variant-numeric:tabular-nums}
.unite-sekmeler button:hover{color:var(--ink);border-color:var(--line-strong)}
.unite-sekmeler button.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:600}
.unite-ara-kapsam{position:relative;flex:1;min-width:170px}
.unite-ara-kapsam svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted);pointer-events:none}
.unite-ara{width:100%;padding:7px 12px 7px 33px;border:1px solid var(--line-strong);border-radius:99px;background:var(--panel-2);font-size:14px;outline:none;transition:border-color .15s,background-color .15s}
.unite-ara:focus{border-color:var(--acc);background:var(--panel)}
.unite{display:grid;grid-template-columns:auto 1fr auto;gap:10px 14px;align-items:center;padding:13px 0;border-top:1px solid var(--line)}
.unite:first-child{border-top:0}
.unite-baslik-satir{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sev-rozet{font-size:11.5px;font-weight:650;padding:2px 8px;border-radius:6px;background:var(--chip);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.sev-rozet.sev-A1{background:var(--ok-bg);color:var(--ok)}
.sev-rozet.sev-A2{background:var(--acc-soft);color:var(--acc)}
.sev-rozet.sev-B1{background:var(--warn-bg);color:var(--warn)}
.sev-rozet.sev-B2{background:color-mix(in srgb,var(--acc) 16%,var(--chip));color:var(--acc)}
.vade-rozet{font-size:12px;font-weight:600;padding:1px 8px;border-radius:99px;background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-border);font-variant-numeric:tabular-nums}
.unite .ad{font-weight:600}
.unite .alt{font-size:13px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
.unite input[type=checkbox]{width:19px;height:19px;accent-color:var(--acc);cursor:pointer}
.mini{height:5px;margin-top:7px}
label.ayar{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:13px 0;border-top:1px solid var(--line);cursor:pointer}
label.ayar:first-of-type{border-top:0}
label.ayar input[type=number]{width:92px;padding:7px 10px;border:1px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--panel-2);font-variant-numeric:tabular-nums}
label.ayar select{padding:7px 10px;border:1px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--panel-2);cursor:pointer}
label.ayar input[type=checkbox]{appearance:none;-webkit-appearance:none;width:44px;height:24px;flex:none;border-radius:99px;background:var(--line-strong);position:relative;cursor:pointer;transition:background-color .16s;border:1px solid transparent}
label.ayar input[type=checkbox]::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--panel);box-shadow:var(--shadow-sm);transition:transform .16s}
label.ayar input[type=checkbox]:checked{background:var(--acc)}
label.ayar input[type=checkbox]:checked::after{transform:translateX(20px)}
label.ayar input[type=checkbox]:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.pratik-secim{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px;margin:14px 0}
.pratik-secim label{display:grid;gap:5px;font-size:14px;font-weight:500}
.pratik-secim select{width:100%;padding:9px 10px;border:1px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--panel-2);cursor:pointer}
.b2-odak-izgara{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:8px;margin-top:10px}
.b2-odak-izgara .btn{justify-content:flex-start;text-align:left;background:var(--panel-2)}
.uyari{font:13px ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--warn);white-space:pre-wrap}

/* konu okuyucu modalı */
.modal{position:fixed;inset:0;background:rgba(10,18,30,.52);backdrop-filter:blur(3px);z-index:20;display:flex;justify-content:center;align-items:flex-start;padding:24px 12px;overflow:auto}

.konu .konu-govde>:first-child{margin-top:0}
.konu p,.konu li{max-width:68ch}
.konu h3{font-size:18px;margin:22px 0 8px}
.konu table{border-collapse:separate;border-spacing:0;width:100%;font-size:14px;margin:14px 0;display:block;overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius-sm)}
.konu td,.konu th{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:8px 12px;text-align:left;vertical-align:top}
.konu th:last-child,.konu td:last-child{border-right:0}
.konu tr:last-child td{border-bottom:0}

.konu blockquote{margin:14px 0;padding:12px 16px;background:var(--acc-soft);border:1px solid color-mix(in srgb,var(--acc) 24%,var(--line));border-radius:var(--radius);max-width:68ch}
.konu .tr{color:var(--muted);font-style:italic}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:500;box-shadow:var(--shadow-card);opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s;pointer-events:none;z-index:30;max-width:90vw}
.toast.on{opacity:1;visibility:visible}
.bitti{text-align:center;padding:30px 16px;display:grid;gap:12px;justify-items:center}
.bitti-ozet{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:4px 0}
.bitti-ozet div{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--radius);padding:10px 16px;min-width:110px}
.bitti-ozet b{display:block;font-size:1.35rem;font-variant-numeric:tabular-nums}
.bitti-ozet span{font-size:13px;color:var(--muted)}
.puan button:disabled{opacity:.4;cursor:not-allowed}
.dinle-satir{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.dinle-satir .btn{font-size:17px}
.tanitim-baslik{font-size:clamp(20px,4.5vw,26px);margin:12px 0 8px;line-height:1.3;font-weight:700}
.ornekler{margin:14px 0;padding-left:1.3em;display:grid;gap:12px}
.ornekler li{padding-left:4px}
.ornek-cevap{margin-top:3px;display:flex;align-items:center;flex-wrap:wrap;gap:4px}
.hatirlatma{background:var(--acc-soft);border:1px solid color-mix(in srgb,var(--acc) 24%,var(--line));border-radius:var(--radius);padding:11px 14px;margin:10px 0}

  .kayit-rozet .rozet-yazi{display:none}

  header{backdrop-filter:none;background:color-mix(in srgb,var(--bg) 96%,transparent)}

    padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--panel) 94%,transparent);
    backdrop-filter:blur(12px);border:0;border-top:1px solid var(--line);border-radius:0;box-shadow:0 -4px 16px rgba(15,27,45,.06)}

  .puan{grid-template-columns:repeat(2,1fr)}

  .toast{bottom:calc(74px + env(safe-area-inset-bottom))}

}
@media (pointer:coarse){
  nav button,.btn,.puan button,.umlaut button{min-height:44px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}

<script>
'use strict';
const SES_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>';
const IKON = {
  gunes: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41m11.32-11.32 1.41-1.41"/></svg>',
  ay: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>',
  otoTema: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor" stroke="none"/></svg>',
  geriAl: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11"/></svg>',
  kitap: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>',
  hedef: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/></svg>',
  zor: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M13 2 3 14h9l-1 8 10-12h-9z"/></svg>',
  artikel: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M8 9h8M8 14h5"/></svg>',
  ara: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
};
/* =====================================================================
   Almanca FSRS — İçerik: ../icerik/*.md (sunucu /api/icerik)
   Kayıt: her cevap /api/tekrar → ilerleme/tekrarlar-<pc>.jsonl
   Durum (stability/difficulty/due) her açılışta kayıtlardan yeniden hesaplanır.
   ===================================================================== */

// ------------------------------------------------------------ yardımcılar
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fnv(s) { let h = 0x811c9dc5; for (const ch of s) { h ^= ch.codePointAt(0); h = Math.imul(h, 0x01000193) >>> 0; } return h.toString(36); }
const DK = 6e4, SAAT = 36e5, GUN = 864e5, DEVIR_SAATI = 4;           // gün 04:00'te döner
function gunNo(t) { const off = new Date(t).getTimezoneOffset() * DK; return Math.floor((t - off - DEVIR_SAATI * SAAT) / GUN); }
function gunBasi(k) { const yaklasik = k * GUN + DEVIR_SAATI * SAAT; return yaklasik + new Date(yaklasik).getTimezoneOffset() * DK; }
function toast(msg, ms = 2600) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), ms); }
function sureYaz(gun) {
  if (gun < 1) return Math.max(1, Math.round(gun * 1440)) + ' dk';
  if (gun < 30) return Math.round(gun) + ' g';
  if (gun < 365) return (gun / 30).toFixed(gun < 60 ? 1 : 0).replace('.', ',') + ' ay';
  return (gun / 365).toFixed(1).replace('.', ',') + ' yıl';
}

// ------------------------------------------------------------ FSRS-6
const W = [0.212, 1.2931, 2.3065, 8.2956, 6.4133, 0.8334, 3.0194, 0.001, 1.8722, 0.1666, 0.796,
           1.4835, 0.0614, 0.2629, 1.6483, 0.6014, 1.8729, 0.5425, 0.0912, 0.0658, 0.1542];
const FSRS = (() => {
  const DECAY = -W[20], FACTOR = Math.pow(0.9, 1 / DECAY) - 1;
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
  const R = (t, S) => Math.pow(1 + FACTOR * t / S, DECAY);
  const aralik = (S, hedef) => S / FACTOR * (Math.pow(hedef, 1 / DECAY) - 1);
  const ilkS = g => Math.max(W[g - 1], 0.001);
  const hamD = g => W[4] - Math.exp(W[5] * (g - 1)) + 1;
  const ilkD = g => clamp(hamD(g), 1, 10);
  const sonrakiD = (D, g) => { const d2 = D + (-W[6] * (g - 3)) * (10 - D) / 9; return clamp(W[7] * hamD(4) + (1 - W[7]) * d2, 1, 10); };
  const kisaS = (S, g) => { let inc = Math.exp(W[17] * (g - 3 + W[18])) * Math.pow(S, -W[19]); if (g >= 3) inc = Math.max(inc, 1); return Math.max(S * inc, 0.001); };
  const hatirlaS = (D, S, r, g) => S * (1 + Math.exp(W[8]) * (11 - D) * Math.pow(S, -W[9]) * (Math.exp((1 - r) * W[10]) - 1) * (g === 2 ? W[15] : 1) * (g === 4 ? W[16] : 1));
  const unutS = (D, S, r) => Math.max(Math.min(W[11] * Math.pow(D, -W[12]) * (Math.pow(S + 1, W[13]) - 1) * Math.exp((1 - r) * W[14]), S / Math.exp(W[17] * W[18])), 0.001);
  // st: {S, D} ya da null (yeni kart); gecen: tam gün farkı
  function adim(st, g, gecen) {
    if (!st) return { S: ilkS(g), D: ilkD(g) };
    let S;
    if (gecen < 1) S = kisaS(st.S, g);
    else { const r = R(gecen, st.S); S = g === 1 ? unutS(st.D, st.S, r) : hatirlaS(st.D, st.S, r, g); }
    return { S, D: sonrakiD(st.D, g) };
  }
  return { adim, aralik, R };
})();

// ------------------------------------------------------------ durum
const VARSAYILAN_AYAR = { yeniLimit: 20, hedef: 0.9, sesOto: false, yeniSira: 'kural-once', pasif: [], ekYeni: {}, dikte: true, onceGoster: true, kuralTur: true, yukKoruma: true };
const D = {
  uniteler: [], kartlar: new Map(), sira: [], uyarilar: [],
  kayitlar: [], durum: new Map(),
  ayar: { ...VARSAYILAN_AYAR },
  oturum: null, ekran: 'ana',
};
const pasifMi = c => D.ayar.pasif.includes(c.unite.id);
function maksAralik() { return 3650; }
function aralikGun(S) { return Math.min(maksAralik(), Math.max(1, Math.round(FSRS.aralik(S, D.ayar.hedef)))); }

// Zor < İyi < Kolay sırası (fsrs4anki kuralı); st önceki durum (yeni kartta null).
function araliklar(st, gecen) {
  const [zor, iyi, kolay] = [2, 3, 4].map(g => aralikGun(FSRS.adim(st || null, g, st ? gecen : 0).S));
  const z = Math.min(zor, iyi);

function uniteAyristir(dosya, metin) {

        else { bolum = '?'; uyar(satir, `bilinmeyen bölüm: "## ${b}"`); }
      }

    }
    if (bolum === 'konu') { konu.push(ham); return; }
    if (bolum === 'yazma') { yazma.push(ham); return; }
    if (!s || s.startsWith('//') || bolum === '?') return;
    if (!bolum) { uyar(satir, 'bölüm başlığından (##) önce satır'); return; }
    const notIdx = s.search(/\s#\s/);
    const govde = (notIdx >= 0 ? s.slice(0, notIdx) : s).trim();
    const not = notIdx >= 0 ? s.slice(notIdx).replace(/^\s#\s/, '').trim() : '';

    if (bolum === 'kelime' || bolum === 'kalip' || bolum === 'tanima') {
      const j = govde.indexOf(' = ');
      if (j < 0 || govde.includes('=>')) { uyar(satir, `"Almanca = Türkçe" biçiminde değil: ${s.slice(0, 60)}`); return; }
      const de = govde.slice(0, j).trim(), tr = govde.slice(j + 3).trim();
      const harf = { kelime: 'k', kalip: 'p', tanima: 't' }[bolum];
      const oge = bolum === 'tanima'
        ? { id: '0', tip: 'tanima', soru: de, cevap: tr, cevaplar: [tr], not, satir }
        : { id: '0', tip: 'cift', soru: tr, cevap: de, cevaplar: alternatifler(de), not, satir };
      u.kartlar.push({ id: tekil(`${id}:${harf}:${fnv(de.toLowerCase())}`), unite: u, tur: bolum, ogeler: [oge] });
      return;
    }
    // kural
    if (s.startsWith('>>')) { kural.hatirlatma.push(s.replace(/^>>\s*/, '')); return; }
    if (s.startsWith('>')) { kural.talimat.push(s.replace(/^>\s*/, '')); return; }

      oge = { tip: 'cift', soru, cevap: alternatifler(cevap)[0], cevaplar: alternatifler(cevap) };

      const oge = k.ogeler[0];
      if (/…|\.\.\./.test(oge.cevap)) continue;
      u.kartlar.push({ id: tekil(`${id}:d:${fnv(oge.cevap.toLowerCase())}`), unite: u, tur: 'dikte', ogeler: [{ ...oge, tip: 'dikte' }] });
    }

}

  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--)
    L[i][j] = k(a[i]) === k(b[j]) ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const ia = new Set(), ib = new Set(); let i = 0, j = 0;
  while (i < a.length && j < b.length) { if (k(a[i]) === k(b[j])) { ia.add(i); ib.add(j); i++; j++; } else if (L[i + 1][j] >= L[i][j + 1]) i++; else j++; }
  return {
    senin: a.map((w, x) => ia.has(x) ? esc(w) : `<del>${esc(w)}</del>`).join(' '),
    dogru: b.map((w, x) => ib.has(x) ? esc(w) : `<ins>${esc(w)}</ins>`).join(' '),
  };
}

function kayitUygula(l) {
  const kart = D.kartlar.get(l.c); if (!kart) return;
  const t = Date.parse(l.t), g = l.r; if (!(g >= 1 && g <= 4) || isNaN(t)) return;
  let st = D.durum.get(l.c);
  if (l.ok === 'biliyorum') {
    const aralik = 365;
    st = {
      S: Math.max(st?.S || 0, aralik),
      D: 1,
      tekrar: (st?.tekrar || 0) + 1,
      unutma: st?.unutma || 0,
      ilk: st ? st.ilk : t,
      son: t,
      sonPuan: 4,
      vade: gunBasi(gunNo(t) + aralik),
      biliyorum: !st ? true : !!st.biliyorum,
      ogeSon: st?.ogeSon || {},
      ogePuan: st?.ogePuan || {},
      sonOgeId: st?.sonOgeId,
    };
    if (l.i != null) {
      st.ogeSon[l.i] = t;
      st.ogePuan[l.i] = 4;
      st.sonOgeId = l.i;
    }
    D.durum.set(l.c, st);
    return;
  }
  const aralik = g === 1 ? 0 : araliklar(st || null, st ? gunNo(t) - gunNo(st.son) : 0)[g - 2];
  if (!st) { st = { ...FSRS.adim(null, g), tekrar: 0, unutma: 0, ilk: t, son: t, ogeSon: {}, ogePuan: {} }; }
  else { Object.assign(st, FSRS.adim(st, g, gunNo(t) - gunNo(st.son))); if (g === 1) st.unutma++; }
  st.tekrar++; st.son = t; st.sonPuan = g;
  st.vade = g === 1 ? t + 10 * DK : gunBasi(gunNo(t) + aralik);
  if (l.i != null) {
    st.ogeSon[l.i] = t;
    (st.ogePuan = st.ogePuan || {})[l.i] = g; st.sonOgeId = l.i;
  }
  D.durum.set(l.c, st);
}
function durumuKur() {
  D.durum = new Map();
  D.kayitlar.sort((a, b) => Date.parse(a.t) - Date.parse(b.t));
  for (const l of D.kayitlar) kayitUygula(l);
}
function onizle(kart, g, simdi = Date.now()) {
  const st = D.durum.get(kart.id);
  if (g === 1) return 10 / 1440;
  return araliklar(st || null, st ? gunNo(simdi) - gunNo(st.son) : 0)[g - 2];
}

async function api(yol, govde, signal) {

  const r = await fetch(yol, govde === undefined ? { cache: 'no-store', signal } :
    { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(govde), signal });
  if (!r.ok) {
    const veri = await r.json().catch(() => null);
    const hata = new Error(veri?.hata || yol + ' ' + r.status);
    hata.durum = r.status;

}
const ESKI_BEKLEYEN = 'almanca-bekleyen';

function kayitReddet(anahtar, kayit) {
  kuyruktanSil(anahtar);

  reddedilen.set(red, kayit);

}

function kuyrugaEkle(kayit) {
  if (geriAlinanIdler.has(kayit.id)) return;
  const anahtar = KAYIT_ONEK + kayitAnahtari(kayit);
  if (bekleyen.get(anahtar)?.tarayici) return;
  let tarayici = false;
  try {
    localStorage.setItem(anahtar, JSON.stringify(kayit));
    tarayici = true;
  } catch {}
  bekleyen.set(anahtar, { kayit, tarayici });
}

function kuyruguOku() {
  try {
    for (const anahtar of Object.keys(localStorage)) {
      if (anahtar.startsWith(IPTAL_ONEK)) {
        try {
          const idler = JSON.parse(localStorage.getItem(anahtar));
          if (Array.isArray(idler) && idler.length && idler.every(id => typeof id === 'string' && id.trim() && id.length <= 128)) {
            iptaller.set(anahtar, { idler });
            idler.forEach(id => geriAlinanIdler.add(id));
          }
        } catch {}
        continue;
      }
      if (anahtar.startsWith(RED_ONEK)) {
        try { reddedilen.set(anahtar, JSON.parse(localStorage.getItem(anahtar))); } catch {}
        continue;
      }
      if (!anahtar.startsWith(KAYIT_ONEK)) continue;
      try {
        const kayit = JSON.parse(localStorage.getItem(anahtar));
        if (kayit?.c && kayit.t) bekleyen.set(anahtar, { kayit, tarayici: true });
      } catch {}
    }
    for (const [anahtar, { kayit }] of bekleyen) if (geriAlinanIdler.has(kayit.id)) kuyruktanSil(anahtar);
    const eski = JSON.parse(localStorage.getItem(ESKI_BEKLEYEN) || '[]');
    if (!Array.isArray(eski)) return;
    for (const kayit of eski) kuyrugaEkle(kayit);
    if (eski.length && eski.every(l => bekleyen.get(KAYIT_ONEK + kayitAnahtari(l))?.tarayici)) {
      localStorage.removeItem(ESKI_BEKLEYEN);
    }
  } catch {}
}

function kuyruktanSil(anahtar) {
  bekleyen.delete(anahtar);
  try { localStorage.removeItem(anahtar); } catch {}
}

function geriAlmayiKuyrugaEkle(idler) {
  const benzersiz = [...new Set(idler)];
  const anahtar = IPTAL_ONEK + benzersiz.join(',');
  try { localStorage.setItem(anahtar, JSON.stringify(benzersiz)); }
  catch { return false; }
  iptaller.set(anahtar, { idler: benzersiz });
  benzersiz.forEach(id => geriAlinanIdler.add(id));
  return true;
}

function kayitlariYukle(kayitlar) {
  kayitlar = kayitlar.filter(l => !geriAlinanIdler.has(l.id));
  const sunucudakiler = new Set(kayitlar.map(kayitAnahtari));
  for (const [anahtar, { kayit }] of bekleyen) {
    if (sunucudakiler.has(kayitAnahtari(kayit))) kuyruktanSil(anahtar);
  }
  D.kayitlar = [...kayitlar, ...[...bekleyen.values()].map(x => x.kayit)];
  durumuKur();
}

// Her kayıt, sunucu yazmayı onaylayana kadar tarayıcı kuyruğunda kalır.
function kaydet(kayit) {
  if (kayit) kuyrugaEkle(kayit);
  if (gonderim || (!bekleyen.size && !iptaller.size)) return gonderim;
  clearTimeout(yenidenDene);
  gonderim = (async () => {
    while (bekleyen.size || iptaller.size) {
      const geriAlma = iptaller.size > 0;
      const [anahtar, islem] = (geriAlma ? iptaller : bekleyen).entries().next().value;
      const siradaki = islem.kayit;
      if (!geriAlma && geriAlinanIdler.has(siradaki.id)) { kuyruktanSil(anahtar); continue; }
      const iptal = new AbortController();
      const sure = setTimeout(() => iptal.abort(), 8000);
      try {
        await api(geriAlma ? '/api/geri-al' : '/api/tekrar', geriAlma ? { idler: islem.idler } : siradaki, iptal.signal);
        if (geriAlma) {
          iptaller.delete(anahtar);
          try { localStorage.removeItem(anahtar); } catch {}
        } else kuyruktanSil(anahtar);
        kayitHata = false;
        kayitDurumunuGoster();
        globalThis.senkron?.pcKayitBildir?.();
      } catch (e) {
        // Kalıcı ret (4xx) yeniden denenmez; kayıt ayrılır, sıradakiler gönderilmeye devam eder.
        if (!geriAlma && KALICI_RED.has(e?.durum)) {
          kayitReddet(anahtar, siradaki);
          kayitDurumunuGoster();
          continue;
        }
        kayitHata = true;
        return;
      } finally {
        clearTimeout(sure);
      }
    }
  })().finally(() => {
    gonderim = null;
    kayitDurumunuGoster();
    if (bekleyen.size || iptaller.size) yenidenDene = setTimeout(() => kaydet(), 15000);
  });
  kayitDurumunuGoster();
  return gonderim;
}

// ------------------------------------------------------------ istatistik
function bugun() { return gunNo(Date.now()); }
function bugunYeni() { let n = 0; const b = bugun(); for (const st of D.durum.values()) if (!st.biliyorum && gunNo(st.ilk) === b) n++; return n; }
function bugunTekrar() { const b = bugun(); return D.kayitlar.filter(l => gunNo(Date.parse(l.t)) === b).length; }
function yukCarpani(vadeSayisi, dunIlkDogruOrani) {
  let carpan = vadeSayisi > 200 ? 0 : vadeSayisi > 120 ? 0.5 : 1;
  if (typeof dunIlkDogruOrani === 'number' && dunIlkDogruOrani < 0.6) carpan *= 0.5;
  return carpan;
}
function yeniKalan() {
  const ek = D.ayar.ekYeni?.[bugun()] || 0;
  const carpan = D.ayar.yukKoruma === false ? 1 : yukCarpani(vadesiGelenler().length, dunOzeti(D.kayitlar, D.sira).ilkDogruOrani);
  return Math.max(0, Math.floor(D.ayar.yeniLimit * carpan) + ek - bugunYeni());
}
function vadesiGelenler(pay = 15 * DK) {
  const sinir = Date.now() + pay;
  return D.sira.filter(k => !pasifMi(k) && D.durum.has(k.id) && D.durum.get(k.id).vade <= sinir)
    .sort((a, b) => D.durum.get(a.id).vade - D.durum.get(b.id).vade);
}
function kuralOnceSec(liste, adet, gunlukLimit, bugunTurSayilari = {}) {
  const secilen = [], idler = new Set();
  const ekle = k => {
    if (secilen.length >= adet || idler.has(k.id)) return false;
    secilen.push(k); idler.add(k.id); return true;
  };
  for (const k of liste) {
    if (secilen.length >= adet) break;
    if (!k.unite?.no) ekle(k);
  }
  let ilkKelimeNo = Infinity, ilkKuralNo = Infinity;
  for (const k of liste) {
    const no = k.unite?.no || 0;
    if (no > 0) {
      if (no < ilkKelimeNo) ilkKelimeNo = no;
      if ((k.tur === 'kural' || k.tur === 'kalip') && no < ilkKuralNo) ilkKuralNo = no;
    }
  }
  if (!Number.isFinite(ilkKelimeNo)) ilkKelimeNo = 0;
  if (!Number.isFinite(ilkKuralNo)) ilkKuralNo = ilkKelimeNo;
  const bas = ilkKuralNo <= ilkKelimeNo + 2 ? ilkKelimeNo : Math.min(ilkKuralNo, ilkKelimeNo + 6);
  const kotalar = {
    kural: Math.min(6, Math.max(1, Math.round(gunlukLimit * 0.15))),
    kalip: Math.round(gunlukLimit * 0.25),
  };
  if (bas > 0) {
    for (const tur of ['kural', 'kalip']) {
      let kalan = Math.max(0, kotalar[tur] - (bugunTurSayilari[tur] || 0));
      for (const k of liste) {
        if (kalan <= 0 || secilen.length >= adet) break;
        const no = k.unite?.no || 0;
        if (k.tur === tur && no >= bas && no <= bas + 2 && ekle(k)) kalan--;
      }
    }
  }
  for (const k of liste) { if (secilen.length >= adet) break; ekle(k); }
  return secilen;
}
function yeniler(adet) {
  let liste = D.sira.filter(k => !pasifMi(k) && !D.durum.has(k.id));
  if (D.ayar.yeniSira === 'kural-once') {
    const sayilar = { kural: 0, kalip: 0 }, b = bugun();
    for (const k of D.sira) {
      const st = D.durum.get(k.id);
      if (k.tur in sayilar && st && !st.biliyorum && gunNo(st.ilk) === b) sayilar[k.tur]++;
    }
    return kuralOnceSec(liste, adet, D.ayar.yeniLimit, sayilar);
  }
  if (D.ayar.yeniSira === 'karisik') liste = liste.slice().sort((a, b) => fnv(a.id) < fnv(b.id) ? -1 : 1);
  return liste.slice(0, adet);
}
function seri() { return gunlukSeri(D.kayitlar).seri; }

// ------------------------------------------------------------ Bugün ekranı yardımcıları
const TAHMIN_GUN = 14, VARSAYILAN_KART_MS = 12000, TAKILAN_ESIK = 4;
// Kalan kartların süresi: son 14 gündeki cevap sürelerinin (ms) medyanı × kart sayısı, dakika olarak.
function tahminiDakika(kalanKart, kayitlar, simdi = Date.now()) {
  const b = gunNo(simdi);
  const sureler = kayitlar.filter(l => { const g = b - gunNo(Date.parse(l.t)); return g >= 0 && g < TAHMIN_GUN && l.ms > 0; })
    .map(l => l.ms).sort((x, y) => x - y);
  const n = sureler.length, orta = n >> 1;
  const medyan = !n ? VARSAYILAN_KART_MS : n % 2 ? sureler[orta] : (sureler[orta - 1] + sureler[orta]) / 2;
  return Math.min(180, Math.max(1, Math.ceil(medyan * kalanKart / DK)));
}
// Ardışık çalışma günleri (bugün çalışılmadıysa dünden geriye) ve son 7 gün (eskiden yeniye).
function gunlukSeri(kayitlar, simdi = Date.now()) {
  const gunler = new Set(kayitlar.map(l => gunNo(Date.parse(l.t))));
  const b = gunNo(simdi);
  let g = gunler.has(b) ? b : b - 1, n = 0;
  while (gunler.has(g)) { n++; g--; }
  return { seri: n, son7: Array.from({ length: 7 }, (_, i) => gunler.has(b - 6 + i)) };
}
// Dünkü çalışmanın özeti. İlk cevap: dün her kartın ilk cevabı; öz değerlendirmede İyi/Kolay doğru sayılır.
function dunOzeti(kayitlar, kartlar, simdi = Date.now()) {
  const dun = gunNo(simdi) - 1, harita = new Map(kartlar.map(k => [k.id, k]));
  const dunku = kayitlar.map(l => ({ l, t: Date.parse(l.t) })).filter(x => gunNo(x.t) === dun).sort((x, y) => x.t - y.t);
  const ilk = new Map(), konular = new Map();
  for (const { l } of dunku) {
    if (!ilk.has(l.c)) ilk.set(l.c, l);
    const kart = harita.get(l.c);
    if (!kart || !(l.r <= 2)) continue;
    const id = kart.tur === 'kural' ? kart.id : kart.unite.id + ':' + kart.tur;
    if (!konular.has(id)) konular.set(id, { id, kart, hata: 0 });
    konular.get(id).hata++;
  }
  const puanli = [...ilk.values()].filter(l => l.ok);
  const dogru = puanli.filter(l => l.ok === 'dogru' || l.ok === 'biliyorum' || (l.ok === 'oz' && l.r >= 3)).length;
  const en = [...konular.values()].sort((x, y) => y.hata - x.hata)[0];
  return {
    ilkDogruOrani: puanli.length ? dogru / puanli.length : null,
    takilan: kartlar.filter(k => (D.durum.get(k.id)?.unutma || 0) >= TAKILAN_ESIK).length,
    zorKonu: en ? { id: en.id, ad: `${uniteEtiketi(en.kart.unite)} · ${en.kart.baslik || TUR_AD[en.kart.tur]}`, kart: en.kart } : null,
  };
}
// Bugünkü hedef: verilen cevaplar + vadesi gelen tekrarlar + bugün kalan yeni kartlar.
function bugunIlerleme() {
  const yapilan = bugunTekrar(), vade = vadesiGelenler().length, yeni = Math.min(yeniKalan(), yeniler(1e6).length);
  return { yapilan, vade, yeni, toplam: yapilan + vade + yeni };
}
function kartDurumu(k) {
  const st = D.durum.get(k.id);
  if (!st) return 'yeni';
  if (st.sonPuan === 1 || st.S < 7) return 'ogren';

}

let almancaSes = null;
function sesSec() {
  if (!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices().filter(v => /^de([-_]|$)/i.test(v.lang));
  almancaSes = vs.find(v => /natural|online|neural/i.test(v.name) && /de[-_]DE/i.test(v.lang)) || vs.find(v => /de[-_]DE/i.test(v.lang)) || vs[0] || null;
}
if ('speechSynthesis' in window) { sesSec(); speechSynthesis.onvoiceschanged = sesSec; }
function sesMetniTemizle(metin) {
  let s = alternatifler(String(metin ?? '').replace(/[{}]/g, '')).shift() || '';
  s = s.replace(/\s*\([^()]*\)\s*$/, '');
  if (s.includes('/') || /[()]/.test(s)) {
    const temiz = varyantlar(s).find(v => !v.includes('/') && !/[()]/.test(v));
    if (temiz) return temiz;
  }
  return s.replace(/[()]/g, '').replace(/([\p{L}'-]+)\/([\p{L}'-]+)/gu, '$1').replace(/\s*\/\s*/g, ', ').replace(/\s+/g, ' ').trim();
}
// Tablet/Android Chrome için sağlamlaştırılmış seslendirme:
// - cancel() hemen ardından speak() Android'de yutuluyor → kısa bekleme

  const benim = ++_sesSayac;
  const konus = (sesKullan) => {

    u.lang = (sesKullan && almancaSes?.lang) || 'de-DE';

    u.rate = hiz;
    u.onerror = e => {
      if (benim !== _sesSayac || e.error === 'interrupted' || e.error === 'canceled') return;
      if (sesKullan && almancaSes) { konus(false); return; }   // varsayılan sesle bir kez daha
      toast(e.error === 'not-allowed' ? 'Seslendirme için önce ekrana dokunun' :
        'Seslendirme çalışmadı (' + (e.error || 'hata') + '). Cihazda Almanca ses yüklü mü?', 4000);
    };
    _sesUtt = u;
    try { speechSynthesis.resume(); } catch {}
    speechSynthesis.speak(u);
  };
  const mesgul = speechSynthesis.speaking || speechSynthesis.pending;
  speechSynthesis.cancel();
  if (mesgul) setTimeout(() => konus(true), 80); else konus(true);
}

// ------------------------------------------------------------ markdown (konu)
function satirIci(s) {
  return esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/\[tr\](.+?)\[\/tr\]/g, '<span class="tr">$1</span>').replace(/\[\/?tr\]/g, '');
}
function md(src) {
  const L = src.split(/\r?\n/); let h = '', i = 0;
  while (i < L.length) {
    const l = L[i];
    if (!l.trim()) { i++; continue; }
    if (/^#{3,6}\s/.test(l)) { h += `<h3>${satirIci(l.replace(/^#+\s*/, ''))}</h3>`; i++; continue; }
    if (/^\s*\|/.test(l)) {
      const satirlar = []; while (i < L.length && /^\s*\|/.test(L[i])) satirlar.push(L[i++]);
      const hucre = r => r.trim().replace(/^\||\|$/g, '').split('|').map(x => x.trim());
      const govde = satirlar.filter(r => !/^\s*\|[\s\-:|]+\|?\s*$/.test(r));
      h += '<table>' + govde.map((r, x) => '<tr>' + hucre(r).map(c => x === 0 ? `<th>${satirIci(c)}</th>` : `<td>${satirIci(c)}</td>`).join('') + '</tr>').join('') + '</table>';
      continue;
    }
    if (/^\s*>/.test(l)) { const b = []; while (i < L.length && /^\s*>/.test(L[i])) b.push(L[i++].replace(/^\s*>\s?/, '')); h += `<blockquote>${b.map(satirIci).join('<br>')}</blockquote>`; continue; }
    if (/^\s*[-*•]\s/.test(l)) { const b = []; while (i < L.length && /^\s*[-*•]\s/.test(L[i])) b.push(L[i++].replace(/^\s*[-*•]\s/, '')); h += `<ul>${b.map(x => `<li>${satirIci(x)}</li>`).join('')}</ul>`; continue; }
    const p = []; while (i < L.length && L[i].trim() && !/^(#{3,6}\s|\s*\||\s*>|\s*[-*•]\s)/.test(L[i])) p.push(L[i++]);
    h += `<p>${p.map(satirIci).join('<br>')}</p>`;
  }
  return h;
}
function konuAc(unite) {
  if (!unite) return;
  const yazmaHtml = unite.yazmaGorevleri?.length
    ? `<hr><h3>Yazma ve Konuşma Görevleri</h3>
      <p class="small muted">Metnini dışarıda yazıp <code>yazilar/</code> klasörüne <code>.md</code> dosyası olarak kaydedebilir ve ajandan düzeltme isteyebilirsin.</p>
      ${unite.yazmaGorevleri.map(g => `<div class="yazma-gorev"><h4>${esc(g.baslik)}</h4>${md(g.metin || '')}</div>`).join('')}`
    : '';
  const konuHtml = unite.konu ? md(unite.konu) : (yazmaHtml ? '' : '<p class="muted">Bu ünitede konu anlatımı yok.</p>');
  modalAc(unite.baslik, konuHtml + yazmaHtml);
}
function modalAc(baslik, govdeHtml) {
  const m = document.createElement('div');
  m.className = 'modal';
  m.setAttribute('role', 'dialog');
  m.setAttribute('aria-modal', 'true');
  m.innerHTML = `<div class="panel konu"><div class="row spread konu-baslik"><b>${esc(baslik)}</b><button class="btn small" data-kapat>Kapat <kbd>Esc</kbd></button></div>
    <div class="konu-govde">${govdeHtml}</div></div>`;
  const oncekiOverflow = document.body?.style?.overflow;
  if (document.body?.style) document.body.style.overflow = 'hidden';
  const kapat = () => {
    m.remove();
    document.removeEventListener('keydown', esck, true);
    if (document.body?.style && !document.querySelector('.modal')) document.body.style.overflow = oncekiOverflow || '';
  };
  const esck = e => { if (e.key === 'Escape') { e.stopPropagation(); kapat(); } };
  m.addEventListener('click', e => { if (e.target === m || e.target.closest('[data-kapat]')) kapat(); });
  document.addEventListener('keydown', esck, true);
  document.body.appendChild(m);
}

const PRATIK_LIMIT = 10;
let odakUnite, odakKonu = 'tumu';
let uniteFiltreSeviye = 'tumu', uniteAramaMetni = '';

function artikelSorulariSec(adet = 15) {
  const havuz = [];
  for (const kart of D.sira) {
    if (pasifMi(kart) || (kart.tur !== 'kelime' && kart.tur !== 'tanima')) continue;
    const oge = kart.ogeler[0];
    if (!oge || /çoğul biçim|yalnız çoğul/i.test(oge.not || '')) continue;
    const de = kart.tur === 'tanima' ? oge.soru : oge.cevap;
    const anlam = kart.tur === 'tanima' ? oge.cevap : oge.soru;
    const ilk = alternatifler(de)[0].trim();
    const m = ilk.match(/^(der|die|das)\s+([A-ZÄÖÜ][\p{L}-]+)$/u);
    if (!m) continue;
    havuz.push({ kart, oge, artikel: m[1], isim: m[2], anlam, tam: ilk });
  }
  for (let i = havuz.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [havuz[i], havuz[j]] = [havuz[j], havuz[i]];
  }
  havuz.sort((a, b) => (kartDurumu(a.kart) === 'olgun' ? 1 : 0) - (kartDurumu(b.kart) === 'olgun' ? 1 : 0));
  return havuz.slice(0, adet);
}

const B2_ODAK_DESEN = {
  edat: /präposition|edat|wechselpräposition|rektion|da\(r\)-|wo\(r\)-|\+\s*(dat|akk)/i,
  kalip_fiil: /nomen-verb|kalıp fiil|funktionsverb|deyim|redewendung/i,
  baglac: /bağlaç|konnektor|nebensatz|obwohl|trotzdem|während|nachdem|sodass|indem|falls|je\s*…?\s*desto|zwar\s*…?\s*aber|um\s*…?\s*zu|damit|statt|als\s+ob/i,
  konjunktiv_passiv: /passiv|edilgen|konjunktiv|dolaylı anlatım|indirekte rede|irreal/i,
};

function b2OdakSorulari(kategori, adet = 15) {
  const rx = B2_ODAK_DESEN[kategori];
  if (!rx) return [];
  const sorular = [];
  for (const kart of D.sira) {
    if (pasifMi(kart) || kart.tur === 'dikte') continue;
    const baslikEs = rx.test(kart.baslik || '') || rx.test(kart.unite?.baslik || '');
    for (const oge of kart.ogeler) {
      const ogeMetin = `${oge.soru || ''} ${oge.cevap || ''} ${oge.not || ''}`;
      if (baslikEs || rx.test(ogeMetin) || (kategori === 'kalip_fiil' && kart.tur === 'kalip' && (kart.unite?.no || 0) >= 35)) {
        sorular.push({ kart, oge });
      }
    }
  }
  for (let i = sorular.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [sorular[i], sorular[j]] = [sorular[j], sorular[i]];
  }
  return sorular.slice(0, adet);
}

function artikelPratikBaslat(donus = 'ana') {

    for (let i = sorular.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [sorular[i], sorular[j]] = [sorular[j], sorular[i]];
    }
    pratikBaslat(sorular.slice(0, PRATIK_LIMIT), konu.selectedOptions[0].textContent, 'odak');
  };
  $('#odak-geri').onclick = () => ekranGoster('ana');
  $('#odak-artikel').onclick = () => artikelPratikBaslat('odak');
  document.querySelectorAll('[data-b2]').forEach(btn => {
    btn.onclick = () => {
      const kat = btn.dataset.b2;
      const sorular = b2OdakSorulari(kat, 15);
      if (!sorular.length) return toast('Bu kategoride aktif soru bulunamadı.');
      pratikBaslat(sorular, btn.textContent, 'odak');
    };
  });
  konulariGoster();
}

function zorlandiklarimiCalis() {
  const sorular = [], gorulen = new Set();
  for (let i = D.kayitlar.length - 1; i >= 0 && sorular.length < PRATIK_LIMIT; i--) {
    const l = D.kayitlar[i];
    if (gorulen.has(l.c)) continue;
    gorulen.add(l.c);
    const kart = D.kartlar.get(l.c);
    if (!kart || pasifMi(kart) || l.r > 2) continue;
    const oge = kart.ogeler.find(o => o.id === l.i) || kart.ogeler[0];
    sorular.push({ kart, oge });
  }
  if (sorular.length) return pratikBaslat(sorular, 'Zorlandıklarım', 'ana');
  const el = $('#pratik-durum');
  el.textContent = 'Aktif ünitelerde son puanı Tekrar veya Zor olan kart yok.';
  el.hidden = false;
}

function uniteSeviyesi(u) {
  if (!u.no) return 'kisisel';
  if (u.no <= 12) return 'A1';
  if (u.no <= 24) return 'A2';
  if (u.no <= 36) return 'B1';
  return 'B2';
}

function uniteEkran() {
  const sevSay = { tumu: D.uniteler.length, A1: 0, A2: 0, B1: 0, B2: 0, kisisel: 0 };
  for (const u of D.uniteler) { const s = uniteSeviyesi(u); if (s in sevSay) sevSay[s]++; }
  const listeHtml = () => {
    const ham = uniteAramaMetni.trim();
    const arananTr = ham.toLocaleLowerCase('tr-TR');
    const arananStd = ham.toLowerCase();
    const suzulen = D.uniteler.filter(u => {
      if (uniteFiltreSeviye !== 'tumu' && uniteSeviyesi(u) !== uniteFiltreSeviye) return false;
      if (ham) {
        const bTr = u.baslik.toLocaleLowerCase('tr-TR'), bStd = u.baslik.toLowerCase();
        const idK = u.id.toLowerCase();
        if (!bTr.includes(arananTr) && !bStd.includes(arananStd) && !idK.includes(arananStd)) return false;
      }
      return true;
    });
    return suzulen.map(u => {
      const kartlar = u.kartlar, n = kartlar.length;

      const tur = t => kartlar.filter(k => k.tur === t).length;

      const satir = kartlar.filter(k => k.tur === 'kural').reduce((a, k) => a + k.ogeler.length, 0);
      const aktif = !D.ayar.pasif.includes(u.id);
      const sev = uniteSeviyesi(u);
      const sevAd = sev === 'kisisel' ? 'Kişisel' : sev;
      return `<div class="unite">
        <input type="checkbox" data-u="${esc(u.id)}" ${aktif ? 'checked' : ''} aria-label="Aktif">
        <div class="unite-ana">
          <div class="unite-baslik-satir"><span class="sev-rozet sev-${esc(sev)}">${esc(sevAd)}</span><span class="ad">${esc(u.baslik)}</span>${vade ? `<span class="vade-rozet">vade ${vade}</span>` : ''}</div>
          <div class="alt">kelime ${tur('kelime')}${tur('tanima') ? ` · tanıma ${tur('tanima')}` : ''} · kalıp ${tur('kalip')}${tur('dikte') ? ` · dikte ${tur('dikte')}` : ''} · kural ${tur('kural')} (${satir} egzersiz) · görüldü ${gorulen}/${n}</div>
          <div class="prog mini"><i style="width:${(100 * olgun / (n || 1)).toFixed(1)}%;background:var(--ok)"></i><i style="width:${(100 * (gorulen - olgun) / (n || 1)).toFixed(1)}%;background:var(--acc);opacity:.5"></i></div>
        </div>
        <span class="row unite-eylemler"><button class="btn small" data-konu="${esc(u.id)}">${IKON.kitap} Konu</button>
        ${elenecek ? `<button class="btn small" data-ele="${esc(u.id)}">Kelimeleri ele (${elenecek})</button>` : ''}</span>
      </div>`;
    }).join('') || '<p class="small muted">Eşleşen ünite bulunamadı.</p>';
  };
  const sekmeler = [
    ['tumu', 'Tümü'], ['A1', 'A1'], ['A2', 'A2'], ['B1', 'B1'], ['B2', 'B2'], ['kisisel', 'Kişisel']
  ];
  $('#app').innerHTML = `<div class="panel">
    <div class="row spread" style="margin-bottom:6px"><h1 class="ekran-baslik">Üniteler</h1>
      <span class="row"><button class="btn small" id="hepsi">Hepsini aç</button><button class="btn small" id="hicbiri">Hepsini kapat</button></span></div>
    <p class="small muted" style="margin-top:0">İşaretsiz ünitelerden yeni kart gelmez ve tekrarları gösterilmez (geçmişleri silinmez).</p>
    <div class="unite-filtre">
      <div class="unite-sekmeler">${sekmeler.map(([kod, ad]) => `<button type="button" data-sev="${kod}" class="${uniteFiltreSeviye === kod ? 'on' : ''}">${ad}<span class="say">${sevSay[kod]}</span></button>`).join('')}</div>
      <div class="unite-ara-kapsam">${IKON.ara}<input class="unite-ara" id="unite-ara" type="search" placeholder="Ünite veya konu ara…" value="${esc(uniteAramaMetni)}" aria-label="Ünite ara"></div>
    </div>
